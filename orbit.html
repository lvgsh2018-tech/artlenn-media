        ${feld("email", "E-Mail", k.email, "email")}
      </div>
      <h3 style="margin:18px 0 10px">Konditionen und Merkmale</h3>
      <div class="gitter g3" style="margin-bottom:14px">
        ${feld("zahlungsziel", "Zahlungsziel in Tagen", k.zahlungsziel, "number", 'min="0" placeholder="Standard"')}
        ${feld("rabatt", "Dauerrabatt in %", k.rabatt, "number", 'min="0" step="0.5"')}
        ${feld("ust_id", "USt-IdNr.", k.ust_id)}
      </div>
      <div class="gitter g2" style="margin-bottom:14px">
        <label class="feld"><span>Merkmale</span>
          <input type="text" name="tags" value="${e(k.tags || "")}"
            placeholder="Stammkunde, Gastronomie, Video">
          <div class="hilfe">Mit Komma trennen. Danach lässt sich filtern.</div></label>
        ${feld("leitweg_id", "Leitweg-ID", k.leitweg_id, "text",
          'placeholder="nur bei öffentlichen Auftraggebern"')}
      </div>
      <label class="feld"><span>Notizen</span>
        <textarea name="notizen" placeholder="Was man über diesen Kunden wissen sollte">${e(k.notizen || "")}</textarea></label>
    </form>`,
    `<button class="knopf still" onclick="dialogZu()">Abbrechen</button>
     <button class="knopf haupt" onclick="kundeSpeichern(${id || "null"})">Speichern</button>`, true);
}

async function kundeSpeichern(id) {
  const werte = formwerte("kundenform");
  if (!werte.firma && !werte.nachname) { melden("Firma oder Nachname wird gebraucht.", true); return; }
  if (id) werte.id = id;
  const r = await versuche(() => sende("/api/kunden", werte), "Kundenkonto gespeichert.");
  if (r) { dialogZu(); Z.start = await hole("/api/start"); zeige("kunden", id || r.id); }
}

async function kundeLoeschen(id) {
  frageNach("Kundenkonto löschen?",
    "Aufträge, Entwürfe, Belege und Notizen dieses Kunden werden mitgelöscht. " +
    "Festgeschriebene Rechnungen verhindern das Löschen – dann bleibt nur das Archivieren.",
    "Endgültig löschen", async () => {
      const r = await versuche(() => sende(`/api/kunde/${id}`, {}, "DELETE"), "Kundenkonto gelöscht.");
      if (r) zeige("kunden");
    }, true);
}

function dialogWiedervorlage(id) {
  dialog("Wiedervorlage setzen", `
    <form id="wvform" onsubmit="return false">
      <div class="gitter g2">
        <label class="feld"><span>Wann nachfassen?</span>
          <input type="date" name="wiedervorlage" value="${inTagen(90)}"></label>
        <label class="feld"><span>Worum geht es?</span>
          <input type="text" name="wiedervorlage_text" placeholder="Nach neuem Projekt fragen"></label>
      </div>
      <div class="hilfe" style="margin-top:10px">Am gewählten Tag erscheint eine Erinnerung
        auf der Startseite und im Kalender.</div>
    </form>`,
    `<button class="knopf still" onclick="dialogZu()">Abbrechen</button>
     <button class="knopf haupt" onclick="wiedervorlageSpeichern(${id})">Setzen</button>`);
}

async function wiedervorlageSpeichern(id) {
  const werte = formwerte("wvform"); werte.id = id;
  const r = await versuche(() => sende("/api/kunden", werte), "Wiedervorlage gesetzt.");
  if (r) { dialogZu(); zeige("kunden", id); }
}

function dialogNotiz(kundeId) {
  dialog("Eintrag im Verlauf", `
    <form id="notizform" onsubmit="return false">
      <div class="gitter g2" style="margin-bottom:14px">
        <label class="feld"><span>Art</span><select name="art">
          ${["Notiz", "Telefon", "E-Mail", "Treffen", "Briefing", "Rückmeldung"].map(a =>
            `<option>${a}</option>`).join("")}</select></label>
        <label class="feld"><span>Datum</span><input type="date" name="datum" value="${heute()}"></label>
      </div>
      <label class="feld"><span>Was wurde besprochen?</span>
        <textarea name="text" style="min-height:120px"></textarea></label>
    </form>`,
    `<button class="knopf still" onclick="dialogZu()">Abbrechen</button>
     <button class="knopf haupt" onclick="notizSpeichern(${kundeId})">Eintragen</button>`);
}

async function notizSpeichern(kundeId) {
  const werte = formwerte("notizform"); werte.kunde_id = kundeId;
  if (!werte.text.trim()) { melden("Der Eintrag ist leer.", true); return; }
  const r = await versuche(() => sende("/api/kundennotiz", werte), "Eintrag gespeichert.");
  if (r) { dialogZu(); kundenReiter = "notizen"; zeige("kunden", kundeId); }
}

async function notizLoeschen(id, kundeId) {
  await versuche(() => sende("/api/kundennotiz", { id }, "DELETE"), "Eintrag gelöscht.");
  kundenReiter = "notizen"; zeige("kunden", kundeId);
}

function dialogKundenpreis(kundeId) {
  dialog("Eigene Kondition", `
    <form id="preisform" onsubmit="return false">
      <div class="gitter g2" style="margin-bottom:14px">
        <label class="feld"><span>Leistung</span>
          <input type="text" name="bezeichnung" placeholder="Videoschnitt" list="leistungsliste">
          <datalist id="leistungsliste">${(Z.einst.leistungen || []).map(l =>
            `<option value="${e(l.name)}">`).join("")}</datalist></label>
        <label class="feld"><span>Preis für diesen Kunden</span>
          <input type="number" name="preis" step="0.01" min="0"></label>
      </div>
      <label class="feld"><span>Bemerkung</span>
        <input type="text" name="bemerkung" placeholder="Stammkundenpreis seit 2025"></label>
    </form>`,
    `<button class="knopf still" onclick="dialogZu()">Abbrechen</button>
     <button class="knopf haupt" onclick="kundenpreisSpeichern(${kundeId})">Speichern</button>`);
}

async function kundenpreisSpeichern(kundeId) {
  const werte = formwerte("preisform"); werte.kunde_id = kundeId;
  const r = await versuche(() => sende("/api/kundenpreis", werte), "Kondition gespeichert.");
  if (r) { dialogZu(); kundenReiter = "preise"; zeige("kunden", kundeId); }
}

async function preisLoeschen(id, kundeId) {
  await versuche(() => sende("/api/kundenpreis", { id }, "DELETE"), "Kondition gelöscht.");
  kundenReiter = "preise"; zeige("kunden", kundeId);
}

function dokumentHinzu(kundeId, auftragId) {
  dateiWaehlen(null, async (name, inhalt) => {
    const r = await versuche(() => sende("/api/dokumente", {
      kunde_id: kundeId, auftrag_id: auftragId || null,
      titel: name.replace(/\.[^.]+$/, ""),
      art: "Sonstiges", datei_name: name, datei_inhalt: inhalt
    }), "Datei abgelegt.");
    if (r) { kundenReiter = "dokumente"; if (kundeId) zeige("kunden", kundeId); }
  });
}

async function dokumentLoeschen(id, kundeId) {
  await versuche(() => sende("/api/dokumente", { id }, "DELETE"), "Eintrag gelöscht.");
  kundenReiter = "dokumente"; zeige("kunden", kundeId);
}

/* ==========================================================================
   Aufträge
   ========================================================================== */

let auftragFilter = "", auftragSuche = "";

async function ansichtAuftraege(id) {
  if (id) return ansichtAuftrag(id);
  const d = await hole(`/api/auftraege?status=${auftragFilter}&suche=${encodeURIComponent(auftragSuche)}`);

  kopf("Aufträge", "Von der Anfrage bis zur Rechnung – ein Auftrag hängt immer an einem Kundenkonto.",
    `<button class="knopf haupt" onclick="dialogAuftrag()">${icon("plus", 14)} Neuer Auftrag</button>`);

  const filter = [["", "Alle"], ["anfrage", "Anfrage"], ["angebot", "Angebot"],
    ["planung", "In der Planung"], ["bearbeitung", "In Bearbeitung"], ["fertig", "Fertig"],
    ["abgerechnet", "Abgerechnet"]];

  malen(`
    <div class="karte">
      <div class="kopf">
        <div class="knopfgruppe">${filter.map(([w, name]) =>
          `<button class="${auftragFilter === w ? "aktiv" : ""}"
            onclick="auftragFilter='${w}';zeige('auftraege')">${name}</button>`).join("")}</div>
        <div class="wachs"></div>
        <div class="suchfeld">${icon("suche", 15)}
          <input type="search" placeholder="Titel, Nummer, Kunde …" value="${e(auftragSuche)}"
            oninput="auftragSuche=this.value; clearTimeout(window._t2); window._t2=setTimeout(()=>zeige('auftraege'),260)">
        </div>
      </div>
      ${d.auftraege.length ? `<div class="tabellenrolle"><table class="liste">
        <thead><tr><th>Nummer</th><th>Auftrag</th><th>Kunde</th><th>Abgabe</th><th>Stand</th>
          <th style="width:110px">Fortschritt</th><th class="r">Stunden</th><th class="r">Summe</th></tr></thead>
        <tbody>${d.auftraege.map(a => `
          <tr class="klickbar" onclick="zeige('auftraege','${a.id}')">
            <td class="mini mute nowrap">${e(a.nummer)}</td>
            <td><b>${e(a.titel || "ohne Titel")}</b>
              ${a.ort ? `<div class="mini mute">${e(a.ort)}</div>` : ""}</td>
            <td class="klein">${e(a.kunde)}</td>
            <td class="klein nowrap ${a.ende && a.ende < heute() && a.status !== "abgerechnet" ? "runter" : ""}">
              ${datum(a.ende) || "–"}</td>
            <td>${statusMarke(a.status)}</td>
            <td><div class="streifen"><div style="width:${a.fortschritt || 0}%"></div></div>
              <div class="mini mute" style="margin-top:2px">${a.fortschritt || 0} %</div></td>
            <td class="r zahl">${a.stunden ? zahl(a.stunden, 1) : "–"}</td>
            <td class="r zahl">${geld(a.summe)}</td>
          </tr>`).join("")}</tbody></table></div>`
        : leerfeld("auftraege", auftragSuche || auftragFilter
            ? "Dazu passt kein Auftrag." : "Noch kein Auftrag angelegt.",
            `<button class="knopf haupt" onclick="dialogAuftrag()">Ersten Auftrag anlegen</button>`)}
    </div>`);
}

async function ansichtAuftrag(id) {
  const d = await hole(`/api/auftrag/${id}`);
  const a = d.auftrag;
  const abgerechnet = d.rechnungen.filter(r => r.typ === "rechnung");

  kopf(e(a.titel || a.nummer), `${e(a.nummer)} · <a onclick="zeige('kunden','${a.kunde_id}')"
      style="cursor:pointer">${e(d.kunde.name)}</a>${a.ort ? " · " + e(a.ort) : ""}`,
    `<button class="knopf still" onclick="zeige('auftraege')">${icon("zurueck", 14)} Alle Aufträge</button>
     <button class="knopf" onclick="dialogAuftrag(${a.id})">${icon("stift", 14)} Bearbeiten</button>
     <button class="knopf" onclick="ausAuftrag(${a.id},'angebot')">${icon("papier", 14)} Angebot</button>
     <button class="knopf haupt" onclick="ausAuftrag(${a.id},'rechnung')">${icon("rechnungen", 14)} Rechnung erstellen</button>`);

  // Der Stand je Position interessiert erst, wenn am Auftrag etwas abgerechnet
  // ist - vorher waere die Spalte nur eine Reihe von "offen".
  const standSpalte = a.status === "abgerechnet" || d.posten.some(p => p.abgerechnet);

  malen(`
    <div class="gitter g4" style="margin-bottom:var(--s-4)">
      ${kennzahl("Stand", `<span style="font-size:17px">${statusMarke(a.status)}</span>`,
        `Fortschritt ${a.fortschritt || 0} %`)}
      ${kennzahl("Auftragssumme", geld(d.summe.brutto),
        standSpalte
          ? (d.summe_offen.brutto ? `${geld(d.summe_offen.brutto)} noch nicht abgerechnet`
                                  : "alles abgerechnet")
          : `${d.posten.length} Positionen`)}
      ${kennzahl("Erfasste Zeit", zahl(d.stunden, 1) + " h",
        d.stunden_offen ? `${zahl(d.stunden_offen, 1)} h noch nicht abgerechnet` : "alles abgerechnet")}
      ${kennzahl("Zeitraum", a.start ? datum(a.start) : "–",
        a.ende ? "Abgabe " + datum(a.ende) : "kein Abgabetermin")}
    </div>

    <div class="gitter g-2-1">
      <div class="stapel">
        <div class="karte">
          <div class="kopf"><h2>Leistungspositionen</h2>
            <button class="knopf klein" onclick="dialogAuftragsposten(${a.id})">
              ${icon("stift", 12)} Positionen bearbeiten</button></div>
          ${d.posten.length ? `<div class="tabellenrolle"><table class="liste">
            <thead><tr><th>Leistung</th><th class="r">Menge</th><th>Einheit</th>
              <th class="r">Einzelpreis</th><th class="r">Betrag</th>
              ${standSpalte ? "<th>Stand</th>" : ""}</tr></thead>
            <tbody>${d.posten.map(p => `<tr>
              <td><b>${e(p.bezeichnung)}</b></td>
              <td class="r zahl">${zahl(p.menge, p.menge % 1 ? 2 : 0)}</td>
              <td class="klein">${e(p.einheit)}</td>
              <td class="r zahl">${geld(p.einzelpreis)}</td>
              <td class="r zahl">${geld(p.menge * p.einzelpreis)}</td>
              ${standSpalte ? `<td>${p.abgerechnet ? `<span class="stand gruen">abgerechnet</span>`
                : `<span class="stand gelb">offen</span>`}</td>` : ""}</tr>`).join("")}
            </tbody></table></div>`
            : leerfeld("leer", "Noch keine Positionen. Ohne sie lässt sich nicht abrechnen.",
              `<button class="knopf haupt" onclick="dialogAuftragsposten(${a.id})">Positionen eintragen</button>`)}
          ${a.beschreibung ? `<div class="leib" style="border-top:1px solid var(--hair)">
            <h3 style="margin-bottom:6px">Beschreibung</h3>
            <div class="klein" style="white-space:pre-line">${e(a.beschreibung)}</div></div>` : ""}
        </div>

        <div class="karte">
          <div class="kopf"><h2>Zeiterfassung</h2>
            <span class="mini mute">Stundensatz ${geld(a.stundensatz)}</span>
            <div class="wachs"></div>
            <button class="knopf klein" onclick="dialogZeit(${a.id})">${icon("plus", 12)} Zeit buchen</button></div>
          ${d.zeiten.length ? `<table class="liste">
            <thead><tr><th>Datum</th><th>Was</th><th class="r">Stunden</th><th>Stand</th><th></th></tr></thead>
            <tbody>${d.zeiten.map(z => `<tr>
              <td class="klein nowrap">${datum(z.datum)}</td>
              <td>${e(z.beschreibung)}</td>
              <td class="r zahl">${zahl(z.stunden, 1)}</td>
              <td>${z.abgerechnet ? `<span class="stand gruen">abgerechnet</span>`
                : `<span class="stand gelb">offen</span>`}</td>
              <td class="r">${z.abgerechnet ? "" : `<button class="knopf klein still"
                onclick="zeitLoeschen(${z.id},${a.id})">${icon("muell", 11)}</button>`}</td></tr>`).join("")}
            </tbody></table>` : leerfeld("uhr", "Noch keine Zeit gebucht.")}
        </div>
      </div>

      <div class="stapel">
        <div class="karte">
          <div class="kopf"><h2>Fortschritt</h2></div>
          <div class="leib">
            <input type="range" min="0" max="100" step="5" value="${a.fortschritt || 0}"
              style="width:100%" oninput="document.getElementById('fw').textContent=this.value+' %'"
              onchange="fortschrittSetzen(${a.id}, this.value)">
            <div class="reihe" style="justify-content:space-between; margin-top:6px">
              <span class="mini mute">0 %</span>
              <b id="fw">${a.fortschritt || 0} %</b>
              <span class="mini mute">100 %</span>
            </div>
            <hr class="trenner">
            <label class="feld"><span>Stand ändern</span>
              <select onchange="statusSetzen(${a.id}, this.value)">
                ${["anfrage", "angebot", "planung", "bearbeitung", "fertig", "abgerechnet", "abgelehnt"]
                  .map(s => `<option value="${s}" ${a.status === s ? "selected" : ""}>
                    ${{ anfrage: "Anfrage", angebot: "Angebot", planung: "In der Planung",
                        bearbeitung: "In Bearbeitung", fertig: "Fertig", abgerechnet: "Abgerechnet",
                        abgelehnt: "Abgelehnt" }[s]}</option>`).join("")}
              </select></label>
          </div>
        </div>

        <div class="karte">
          <div class="kopf"><h2>Belege zum Auftrag</h2>
            <button class="knopf klein" onclick="dialogBeleg(null,${a.kunde_id},${a.id})">
              ${icon("plus", 12)}</button></div>
          ${d.belege.length ? `<table class="liste"><tbody>${d.belege.map(b => `<tr>
            <td class="klein">${datum(b.datum)}<div>${e(b.beschreibung)}</div></td>
            <td class="r zahl">${geld(b.betrag)}<div class="mini mute">
              ${b.abgerechnet ? "abgerechnet" : b.weiterberechnen ? "wird berechnet" : "nur Ausgabe"}</div></td>
            </tr>`).join("")}</tbody></table>`
            : `<div class="leer klein">Keine Auslagen erfasst.</div>`}
        </div>

        <div class="karte">
          <div class="kopf"><h2>Vorgänge</h2></div>
          ${d.rechnungen.length ? `<table class="liste"><tbody>${d.rechnungen.map(r => `
            <tr class="klickbar" onclick="dialogRechnung(${r.id})">
              <td><b>${e(r.nummer || "Entwurf")}</b>
                <div class="mini mute">${{ rechnung: "Rechnung", angebot: "Angebot",
                  storno: "Korrektur" }[r.typ]} · ${datum(r.datum)}</div></td>
              <td class="r zahl">${geld(r.brutto)}<div>${rechnungsMarke(r)}</div></td>
            </tr>`).join("")}</tbody></table>`
            : `<div class="leer klein">Noch nichts abgerechnet.</div>`}
        </div>
      </div>
    </div>`);
}

async function fortschrittSetzen(id, wert) {
  await versuche(() => sende("/api/auftraege", { id, fortschritt: Number(wert) }));
}
async function statusSetzen(id, status) {
  await versuche(async () => { await sende("/api/auftraege", { id, status }); await zeige("auftraege", id); },
    "Stand geändert.");
}
async function ausAuftrag(id, art) {
  const r = await versuche(() => sende(`/api/auftrag/${id}/${art}`, {}),
    art === "angebot" ? "Angebot als Entwurf angelegt." : "Rechnung als Entwurf angelegt.");
  if (r) { Z.start = await hole("/api/start"); dialogRechnung(r.id); }
}
async function zeitLoeschen(id, auftragId) {
  await versuche(() => sende("/api/zeit", { id }, "DELETE"), "Zeitbuchung gelöscht.");
  zeige("auftraege", auftragId);
}

async function dialogAuftrag(id, kundeId) {
  let a = { status: "anfrage", start: heute(), fortschritt: 0 };
  if (id) a = (await hole(`/api/auftrag/${id}`)).auftrag;
  if (kundeId) a.kunde_id = kundeId;
  const kunden = (await hole("/api/kunden")).kunden;

  dialog(id ? "Auftrag bearbeiten" : "Neuer Auftrag", `
    <form id="auftragsform" onsubmit="return false">
      <label class="feld" style="margin-bottom:14px"><span>Für welchen Kunden?</span>
        <select name="kunde_id" ${id ? "disabled" : ""}>
          <option value="">– bitte wählen –</option>
          ${kunden.map(k => `<option value="${k.id}" ${String(a.kunde_id) === String(k.id) ? "selected" : ""}>
            ${e(k.nummer)} · ${e(k.name)}</option>`).join("")}
        </select></label>
      <label class="feld" style="margin-bottom:14px"><span>Worum geht es? (Was)</span>
        <input type="text" name="titel" value="${e(a.titel || "")}"
          placeholder="Imagefilm für die Sommerkampagne"></label>
      <label class="feld" style="margin-bottom:14px"><span>Beschreibung (Wie)</span>
        <textarea name="beschreibung" placeholder="Ablauf, Absprachen, Besonderheiten">${e(a.beschreibung || "")}</textarea></label>
      <div class="gitter g3" style="margin-bottom:14px">
        <label class="feld"><span>Ort (Wo)</span>
          <input type="text" name="ort" value="${e(a.ort || "")}"></label>
        <label class="feld"><span>Start</span>
          <input type="date" name="start" value="${e(a.start || "")}"></label>
        <label class="feld"><span>Abgabe</span>
          <input type="date" name="ende" value="${e(a.ende || "")}"></label>
      </div>
      <div class="gitter g3">
        <label class="feld"><span>Stand</span><select name="status">
          ${["anfrage", "angebot", "planung", "bearbeitung", "fertig", "abgerechnet", "abgelehnt"]
            .map(s => `<option value="${s}" ${a.status === s ? "selected" : ""}>
              ${{ anfrage: "Anfrage", angebot: "Angebot", planung: "In der Planung",
                  bearbeitung: "In Bearbeitung", fertig: "Fertig", abgerechnet: "Abgerechnet",
                  abgelehnt: "Abgelehnt" }[s]}</option>`).join("")}</select></label>
        <label class="feld"><span>Stundensatz</span>
          <input type="number" name="stundensatz" step="0.01" min="0" value="${a.stundensatz || ""}">
          <div class="hilfe">Für die Zeiterfassung.</div></label>
        <label class="feld"><span>Fortschritt in %</span>
          <input type="number" name="fortschritt" min="0" max="100" step="5" value="${a.fortschritt || 0}"></label>
      </div>
    </form>`,
    `${id ? `<button class="knopf gefahr" onclick="auftragLoeschen(${id})">Löschen</button>` : ""}
     <div class="wachs"></div>
     <button class="knopf still" onclick="dialogZu()">Abbrechen</button>
     <button class="knopf haupt" onclick="auftragSpeichern(${id || "null"})">Speichern</button>`, true);
}

async function auftragSpeichern(id) {
  const werte = formwerte("auftragsform");
  if (id) { werte.id = id; delete werte.kunde_id; }
  else if (!werte.kunde_id) { melden("Bitte ein Kundenkonto wählen.", true); return; }
  const r = await versuche(() => sende("/api/auftraege", werte), "Auftrag gespeichert.");
  if (r) { dialogZu(); Z.start = await hole("/api/start"); zeige("auftraege", id || r.id); }
}

function auftragLoeschen(id) {
  frageNach("Auftrag löschen?", "Positionen und Zeitbuchungen verschwinden mit. " +
    "Bereits erstellte Rechnungen bleiben bestehen.", "Löschen", async () => {
      const r = await versuche(() => sende(`/api/auftrag/${id}`, {}, "DELETE"), "Auftrag gelöscht.");
      if (r) { dialogZu(); zeige("auftraege"); }
    }, true);
}

function dialogZeit(auftragId) {
  dialog("Zeit buchen", `
    <form id="zeitform" onsubmit="return false">
      <div class="gitter g2" style="margin-bottom:14px">
        <label class="feld"><span>Datum</span><input type="date" name="datum" value="${heute()}"></label>
        <label class="feld"><span>Stunden</span>
          <input type="number" name="stunden" step="0.25" min="0" value="1"></label>
      </div>
      <label class="feld"><span>Woran gearbeitet?</span>
        <input type="text" name="beschreibung" placeholder="Rohschnitt, erste Fassung"></label>
    </form>`,
    `<button class="knopf still" onclick="dialogZu()">Abbrechen</button>
     <button class="knopf haupt" onclick="zeitSpeichern(${auftragId})">Buchen</button>`);
}

async function zeitSpeichern(auftragId) {
  const werte = formwerte("zeitform"); werte.auftrag_id = auftragId;
  const r = await versuche(() => sende("/api/zeit", werte), "Zeit gebucht.");
  if (r) { dialogZu(); zeige("auftraege", auftragId); }
}
</script>
<script>
"use strict";

/* ==========================================================================
   Positionen bearbeiten - gleiche Bedienung bei Auftrag und Rechnung
   ========================================================================== */

let P = { posten: [], leistungen: [], kundenpreise: [], steuer: 0 };

function postenZeichnen() {
  const feld = document.getElementById("postenfeld");
  if (!feld) return;
  feld.innerHTML = `
    <div class="postenzeile kopf">
      <span>Leistung</span><span>Menge</span><span>Einheit</span><span>Einzelpreis</span><span></span>
    </div>
    ${P.posten.map((p, i) => `
      <div class="postenzeile">
        <input type="text" value="${e(p.bezeichnung)}" list="katalog" placeholder="Was wird berechnet?"
          oninput="postenAendern(${i},'bezeichnung',this.value)"
          onchange="postenVorschlag(${i},this.value)" aria-label="Leistung Position ${i + 1}">
        <input type="number" step="0.25" value="${p.menge}" aria-label="Menge"
          oninput="postenAendern(${i},'menge',this.value)">
        <input type="text" value="${e(p.einheit)}" aria-label="Einheit"
          oninput="postenAendern(${i},'einheit',this.value)">
        <input type="number" step="0.01" value="${p.einzelpreis}" aria-label="Einzelpreis"
          oninput="postenAendern(${i},'einzelpreis',this.value)">
        <button class="knopf klein still" onclick="postenWeg(${i})"
          aria-label="Position entfernen">${icon("muell", 13)}</button>
      </div>`).join("")}
    <datalist id="katalog">
      ${P.kundenpreise.map(l => `<option value="${e(l.bezeichnung)}">`).join("")}
      ${P.leistungen.map(l => `<option value="${e(l.name)}">`).join("")}
    </datalist>
    <div class="reihe" style="margin-top:6px">
      <button class="knopf klein" onclick="postenDazu()">${icon("plus", 12)} Position</button>
      <div class="wachs"></div>
      <div class="r">
        <span class="mute klein">Summe</span>
        <b class="zahl" style="font-size:17px; margin-left:8px" id="postensumme">${geld(postenSumme())}</b>
      </div>
    </div>`;
}

function postenSumme() {
  return P.posten.reduce((s, p) => s + Number(p.menge || 0) * Number(p.einzelpreis || 0), 0);
}

function postenAendern(i, feld, wert) {
  P.posten[i][feld] = (feld === "menge" || feld === "einzelpreis") ? Number(wert || 0) : wert;
  const s = document.getElementById("postensumme");
  if (s) s.textContent = geld(postenSumme());
}

function postenVorschlag(i, name) {
  const eigen = P.kundenpreise.find(l => l.bezeichnung === name);
  const katalog = P.leistungen.find(l => l.name === name);
  if (!eigen && !katalog) return;
  if (Number(P.posten[i].einzelpreis) === 0) {
    P.posten[i].einzelpreis = Number(eigen ? eigen.preis : katalog.preis);
    if (katalog) P.posten[i].einheit = katalog.einheit;
    P.posten[i].steuersatz = katalog ? Number(katalog.steuersatz || 0) : P.steuer;
    postenZeichnen();
  }
}

function postenDazu() {
  P.posten.push({ bezeichnung: "", menge: 1, einheit: "Stück", einzelpreis: 0, steuersatz: P.steuer });
  postenZeichnen();
}

function postenWeg(i) { P.posten.splice(i, 1); postenZeichnen(); }

async function postenVorbereiten(kundeId) {
  P.leistungen = (await hole("/api/leistungen")).leistungen;
  P.steuer = Z.einst.einstellungen && Z.einst.einstellungen.kleinunternehmer === "ja"
    ? 0 : Number((Z.einst.einstellungen || {}).steuersatz || 0);
  P.kundenpreise = kundeId ? (await hole(`/api/kunde/${kundeId}`)).preise : [];
}

async function dialogAuftragsposten(auftragId) {
  const d = await hole(`/api/auftrag/${auftragId}`);
  await postenVorbereiten(d.auftrag.kunde_id);
  // Abgerechnetes bleibt stehen und wird nur noch angezeigt - wie eine
  // abgerechnete Zeitbuchung, die sich auch nicht mehr loeschen laesst.
  const fest = d.posten.filter(p => p.abgerechnet);
  const offen = d.posten.filter(p => !p.abgerechnet);
  P.posten = offen.length ? offen.map(p => ({ ...p }))
    : [{ bezeichnung: "", menge: 1, einheit: "Stück", einzelpreis: 0, steuersatz: P.steuer }];
  dialog("Positionen des Auftrags",
    `${fest.length ? `<div class="karte" style="margin-bottom:12px">
       <div class="kopf"><h3 style="font-size:13px">Bereits abgerechnet</h3></div>
       <table class="liste"><tbody>${fest.map(p => `<tr>
         <td>${e(p.bezeichnung)}</td>
         <td class="r zahl klein">${zahl(p.menge, p.menge % 1 ? 2 : 0)} ${e(p.einheit)}</td>
         <td class="r zahl">${geld(p.menge * p.einzelpreis)}</td>
         <td><span class="stand gruen">abgerechnet</span></td></tr>`).join("")}</tbody></table>
       <div class="leib klein mute" style="border-top:1px solid var(--hair)">
         Diese Zeilen stehen schon auf einer Rechnung und bleiben unverändert.</div></div>` : ""}
     <div class="klein mute" style="margin-bottom:12px">Das hier wird später eins zu eins
      in Angebot und Rechnung übernommen. Tipp: Beim Tippen schlägt der Leistungskatalog Preise vor.</div>
     <div class="posten" id="postenfeld"></div>`,
    `<button class="knopf still" onclick="dialogZu()">Abbrechen</button>
     <button class="knopf haupt" onclick="auftragspostenSpeichern(${auftragId})">Übernehmen</button>`, true);
  postenZeichnen();
}

async function auftragspostenSpeichern(auftragId) {
  const posten = P.posten.filter(p => p.bezeichnung.trim());
  const r = await versuche(() => sende("/api/auftraege", { id: auftragId, posten }),
    "Positionen gespeichert.");
  if (r) { dialogZu(); zeige("auftraege", auftragId); }
}

/* ==========================================================================
   Rechnungen und Angebote
   ========================================================================== */

let rechnungArt = "rechnung", rechnungStatus = "", rechnungJahr = "", rechnungSuche = "";

async function ansichtRechnungen() {
  const d = await hole(`/api/rechnungen?typ=${rechnungArt}&status=${rechnungStatus}` +
    `&jahr=${rechnungJahr}&suche=${encodeURIComponent(rechnungSuche)}`);

  const offen = d.rechnungen.filter(r => r.status === "offen");
  const summeOffen = offen.reduce((s, r) => s + Number(r.brutto || 0), 0);
  const ueber = offen.filter(r => r.ueberfaellig);

  kopf(rechnungArt === "angebot" ? "Angebote" : "Rechnungen",
    rechnungArt === "angebot"
      ? "Aus einem angenommenen Angebot wird mit einem Klick ein Auftrag."
      : `${offen.length} offen über ${geld(summeOffen)}` +
        (ueber.length ? ` · <b class="runter">${ueber.length} überfällig</b>` : ""),
    `<a class="knopf" href="/ausgabe/rechnungen.csv?jahr=${rechnungJahr || new Date().getFullYear()}">
       ${icon("runter", 14)} Als Tabelle</a>
     <button class="knopf haupt" onclick="dialogRechnungNeu('${rechnungArt}')">
       ${icon("plus", 14)} ${rechnungArt === "angebot" ? "Neues Angebot" : "Neue Rechnung"}</button>`);

  const stati = rechnungArt === "angebot"
    ? [["", "Alle"], ["entwurf", "Entwürfe"], ["offen", "Verschickt"], ["angenommen", "Angenommen"],
       ["abgelehnt", "Abgelehnt"]]
    : [["", "Alle"], ["entwurf", "Entwürfe"], ["offen", "Offen"], ["ueberfaellig", "Überfällig"],
       ["bezahlt", "Bezahlt"], ["storniert", "Storniert"]];

  malen(`
    <div class="karte">
      <div class="kopf">
        <div class="knopfgruppe">
          <button class="${rechnungArt === "rechnung" ? "aktiv" : ""}"
            onclick="rechnungArt='rechnung';rechnungStatus='';zeige('rechnungen')">Rechnungen</button>
          <button class="${rechnungArt === "angebot" ? "aktiv" : ""}"
            onclick="rechnungArt='angebot';rechnungStatus='';zeige('rechnungen')">Angebote</button>
        </div>
        <div class="knopfgruppe">${stati.map(([w, name]) =>
          `<button class="${rechnungStatus === w ? "aktiv" : ""}"
            onclick="rechnungStatus='${w}';zeige('rechnungen')">${name}</button>`).join("")}</div>
        <div class="wachs"></div>
        <select style="width:auto" onchange="rechnungJahr=this.value;zeige('rechnungen')">
          <option value="">Alle Jahre</option>
          ${d.jahre.map(j => `<option value="${j}" ${String(rechnungJahr) === String(j) ? "selected" : ""}>${j}</option>`).join("")}
        </select>
        <div class="suchfeld">${icon("suche", 15)}
          <input type="search" placeholder="Nummer oder Kunde …" value="${e(rechnungSuche)}"
            oninput="rechnungSuche=this.value; clearTimeout(window._t3); window._t3=setTimeout(()=>zeige('rechnungen'),260)">
        </div>
      </div>
      ${d.rechnungen.length ? `<div class="tabellenrolle"><table class="liste">
        <thead><tr><th>Nummer</th><th>Kunde</th><th>Datum</th><th>Fällig</th><th>Stand</th>
          <th class="r">Betrag</th><th style="width:1%"></th></tr></thead>
        <tbody>${d.rechnungen.map(r => `
          <tr class="klickbar" onclick="dialogRechnung(${r.id})">
            <td><b>${e(r.nummer || "Entwurf")}</b>
              ${r.typ === "storno" ? `<div class="mini mute">Korrektur</div>` : ""}
              ${r.auftragsnummer ? `<div class="mini mute">${e(r.auftragsnummer)}</div>` : ""}</td>
            <td>${e(r.kunde)}<div class="mini mute">${e(r.kundennummer)}</div></td>
            <td class="klein nowrap">${datum(r.datum)}</td>
            <td class="klein nowrap ${r.ueberfaellig ? "runter" : ""}">${datum(r.faellig_am)}</td>
            <td>${rechnungsMarke(r)}</td>
            <td class="r zahl ${r.typ === "storno" ? "runter" : ""}">
              <b>${r.typ === "storno" ? "\u2212 " + geld(r.brutto) : geld(r.brutto)}</b></td>
            <td class="r nowrap" onclick="event.stopPropagation()">
              ${r.status === "offen" && r.typ === "rechnung"
                ? `<button class="knopf klein" onclick="bezahltSetzen(${r.id})"
                     title="Zahlung ist eingegangen">${icon("haken", 12)}</button>` : ""}
              <a class="knopf klein" href="/${r.typ === "angebot" ? "angebot" : "rechnung"}/${r.id}.html"
                target="_blank" title="Ansehen und drucken">${icon("drucken", 12)}</a>
            </td>
          </tr>`).join("")}</tbody></table></div>`
        : leerfeld("rechnungen", rechnungSuche || rechnungStatus
            ? "Dazu passt kein Vorgang."
            : rechnungArt === "angebot" ? "Noch kein Angebot geschrieben." : "Noch keine Rechnung geschrieben.",
            `<button class="knopf haupt" onclick="dialogRechnungNeu('${rechnungArt}')">
              ${rechnungArt === "angebot" ? "Erstes Angebot" : "Erste Rechnung"} schreiben</button>`)}
    </div>`);
}

async function dialogRechnungNeu(typ) {
  const kunden = (await hole("/api/kunden")).kunden;
  if (!kunden.length) { melden("Lege zuerst ein Kundenkonto an.", true); return; }
  dialog(typ === "angebot" ? "Neues Angebot" : "Neue Rechnung", `
    <form id="neuform" onsubmit="return false">
      <label class="feld" style="margin-bottom:14px"><span>Für welchen Kunden?</span>
        <select name="kunde_id">
          ${kunden.map(k => `<option value="${k.id}">${e(k.nummer)} · ${e(k.name)}</option>`).join("")}
        </select></label>
      <div class="gitter g2">
        <label class="feld"><span>Datum</span><input type="date" name="datum" value="${heute()}"></label>
        <label class="feld"><span>Leistungsdatum</span>
          <input type="date" name="leistungsdatum" value="${heute()}"></label>
      </div>
      <div class="hilfe" style="margin-top:12px">Der Vorgang wird zunächst als Entwurf angelegt.
        Erst mit dem Festschreiben bekommt er seine endgültige Nummer.</div>
    </form>`,
    `<button class="knopf still" onclick="dialogZu()">Abbrechen</button>
     <button class="knopf haupt" onclick="rechnungAnlegen('${typ}')">Anlegen</button>`);
}

async function rechnungAnlegen(typ) {
  const werte = formwerte("neuform"); werte.typ = typ;
  werte.kunde_id = Number(werte.kunde_id);
  const r = await versuche(() => sende("/api/rechnungen", werte));
  if (r) { dialogZu(); dialogRechnung(r.id); }
}

async function dialogRechnung(id) {
  const d = await hole(`/api/rechnung/${id}`);
  const r = d.rechnung, k = d.kunde;
  const entwurf = !r.festgeschrieben;
  const angebot = r.typ === "angebot";
  const pfad = angebot ? "angebot" : "rechnung";
  await postenVorbereiten(r.kunde_id);
  P.posten = d.posten.length ? d.posten.map(p => ({ ...p }))
    : [{ bezeichnung: "", menge: 1, einheit: "Stück", einzelpreis: 0, steuersatz: P.steuer }];

  const kopfteil = entwurf ? `
    <div class="gitter g4" style="margin-bottom:16px">
      <label class="feld"><span>Datum</span>
        <input type="date" id="r_datum" value="${e(r.datum || heute())}"></label>
      <label class="feld"><span>Leistungsdatum</span>
        <input type="date" id="r_leistung" value="${e(r.leistungsdatum || "")}"></label>
      <label class="feld"><span>Zahlungsziel</span>
        <input type="number" id="r_ziel" min="0" value="${r.zahlungsziel || 14}"></label>
      <label class="feld"><span>Vorlage</span>
        <select id="r_vorlage">
          ${[["artlenn", "ARTLENN"], ["klar", "Klar"], ["klassisch", "Klassisch"], ["kompakt", "Kompakt"]].map(([w, n]) =>
            `<option value="${w}" ${r.vorlage === w ? "selected" : ""}>${n}</option>`).join("")}
        </select></label>
    </div>
    <label class="feld" style="margin-bottom:16px"><span>Einleitender Text</span>
      <textarea id="r_kopf" style="min-height:56px"
        placeholder="Vielen Dank für den Auftrag. Wie besprochen berechne ich:">${e(r.kopftext || "")}</textarea></label>
    <div class="posten" id="postenfeld"></div>
    <label class="feld" style="margin-top:16px"><span>Schlusstext</span>
      <textarea id="r_fuss" style="min-height:48px">${e(r.fusstext || "")}</textarea></label>
    ${angebot ? "" : `
    <hr class="trenner">
    <label class="reihe" style="cursor:pointer">
      <input type="checkbox" id="r_wieder" ${r.wiederkehrend ? "checked" : ""}
        onchange="document.getElementById('wiederfeld').classList.toggle('versteckt',!this.checked)">
      <span>Diese Rechnung wiederholt sich regelmäßig (Dauerauftrag, Abo)</span>
    </label>
    <div class="gitter g2 ${r.wiederkehrend ? "" : "versteckt"}" id="wiederfeld" style="margin-top:10px">
      <label class="feld"><span>Rhythmus</span><select id="r_rhythmus">
        ${[["monatlich", "Jeden Monat"], ["quartalsweise", "Jedes Quartal"], ["jaehrlich", "Jedes Jahr"]]
          .map(([w, n]) => `<option value="${w}" ${r.rhythmus === w ? "selected" : ""}>${n}</option>`).join("")}
      </select></label>
      <label class="feld"><span>Nächste Rechnung am</span>
        <input type="date" id="r_naechste" value="${e(r.naechste_am || "")}"></label>
    </div>`}
  ` : `
    <div class="karte" style="margin-bottom:16px; background:var(--soft)">
      <div class="leib eng klein">
        Dieser Beleg ist festgeschrieben. Das verlangt die GoBD: einmal gestellte Rechnungen
        dürfen nicht mehr verändert werden. Stimmt etwas nicht, erstelle eine Rechnungskorrektur.
      </div>
    </div>
    <div class="tabellenrolle"><table class="liste">
      <thead><tr><th>Leistung</th><th class="r">Menge</th><th>Einheit</th>
        <th class="r">Einzelpreis</th><th class="r">Betrag</th></tr></thead>
      <tbody>${d.posten.map(p => `<tr><td><b>${e(p.bezeichnung)}</b></td>
        <td class="r zahl">${zahl(p.menge, p.menge % 1 ? 2 : 0)}</td>
        <td class="klein">${e(p.einheit)}</td>
        <td class="r zahl">${geld(p.einzelpreis)}</td>
        <td class="r zahl">${geld(p.menge * p.einzelpreis)}</td></tr>`).join("")}</tbody>
      <tfoot><tr><td colspan="4" class="r"><b>Gesamt</b></td>
        <td class="r zahl"><b>${geld(r.brutto)}</b></td></tr></tfoot>
    </table></div>`;

  const angaben = `
    <div class="reihe-weit klein mute" style="margin-bottom:16px">
      <span>${icon("kunden", 13)} <a onclick="dialogZu();zeige('kunden','${k.id}')"
        style="cursor:pointer">${e(k.name)}</a></span>
      ${r.nummer ? `<span>Nummer <b>${e(r.nummer)}</b></span>` : `<span>noch ohne Nummer</span>`}
      <span>${datum(r.datum)}</span>
      ${r.faellig_am && !angebot ? `<span>fällig ${datum(r.faellig_am)}</span>` : ""}
      <span>${rechnungsMarke(r)}</span>
      ${r.mahnstufe ? `<span class="stand rot">Mahnstufe ${r.mahnstufe} vom ${datum(r.mahnung_am)}</span>` : ""}
    </div>`;

  let knoepfe = `<button class="knopf still" onclick="dialogZu()">Schließen</button>`;
  if (entwurf) {
    knoepfe = `<button class="knopf gefahr" onclick="rechnungLoeschen(${id})">Entwurf löschen</button>
      <div class="wachs"></div>
      <button class="knopf" onclick="rechnungSpeichern(${id}, false)">Speichern</button>
      <button class="knopf haupt" onclick="rechnungSpeichern(${id}, true)">
        ${icon("haken", 14)} Festschreiben${angebot ? "" : " und stellen"}</button>`;
  } else {
    const teile = [`<a class="knopf" href="/${pfad}/${id}.html" target="_blank">
        ${icon("drucken", 14)} Ansehen und drucken</a>`];
    if (r.typ === "storno") {
      teile.push(`<a class="knopf" href="/rechnung/${id}.xml">${icon("runter", 14)} E-Rechnung</a>`);
      if (r.status === "offen") {
        teile.push(`<button class="knopf haupt" onclick="bezahltSetzen(${id});dialogZu()">
          ${icon("geld", 14)} Erstattung ausgezahlt</button>`);
      }
    } else if (!angebot) {
      teile.push(`<a class="knopf" href="/rechnung/${id}.xml">${icon("runter", 14)} E-Rechnung</a>`);
      if (r.status === "offen") {
        teile.push(`<a class="knopf" href="/mahnung/${id}.html?stufe=${Math.min(3, (r.mahnstufe || 0) + 1)}"
          target="_blank" onclick="mahnstufeHoch(${id})">${icon("glocke", 14)}
          ${(r.mahnstufe || 0) === 0 ? "Erinnern" : "Mahnen"}</a>`);
        teile.push(`<button class="knopf haupt" onclick="bezahltSetzen(${id});dialogZu()">
          ${icon("geld", 14)} Bezahlt</button>`);
      }
      if (r.status === "bezahlt") {
        teile.push(`<button class="knopf" onclick="bezahltSetzen(${id});dialogZu()">
          Zahlung zurücknehmen</button>`);
      }
      if (r.status !== "storniert" && r.typ === "rechnung") {
        teile.push(`<button class="knopf gefahr" onclick="rechnungStornieren(${id})">Korrigieren</button>`);
      }
    } else if (r.status === "offen") {
      teile.push(`<button class="knopf" onclick="angebotAblehnen(${id})">Abgelehnt</button>`);
      teile.push(`<button class="knopf haupt" onclick="angebotAnnehmen(${id})">
        ${icon("haken", 14)} Angenommen – Auftrag daraus machen</button>`);
    }
    knoepfe = `<button class="knopf still" onclick="dialogZu()">Schließen</button>
      <div class="wachs"></div>${teile.join(" ")}`;
  }

  dialog(`${angebot ? "Angebot" : r.typ === "storno" ? "Rechnungskorrektur" : "Rechnung"} ` +
    `${r.nummer ? e(r.nummer) : "(Entwurf)"}`, angaben + kopfteil, knoepfe, true);
  if (entwurf) postenZeichnen();
}

function rechnungFelder() {
  const wert = (id) => { const el = document.getElementById(id); return el ? el.value : undefined; };
  const werte = {
    datum: wert("r_datum"), leistungsdatum: wert("r_leistung"),
    zahlungsziel: Number(wert("r_ziel") || 0), vorlage: wert("r_vorlage"),
    kopftext: wert("r_kopf"), fusstext: wert("r_fuss"),
    posten: P.posten.filter(p => (p.bezeichnung || "").trim())
  };
  const wieder = document.getElementById("r_wieder");
  if (wieder) {
    werte.wiederkehrend = wieder.checked ? 1 : 0;
    werte.rhythmus = wieder.checked ? wert("r_rhythmus") : "";
    werte.naechste_am = wieder.checked ? wert("r_naechste") : "";
  }
  return werte;
}

async function rechnungSpeichern(id, festschreiben) {
  const werte = rechnungFelder(); werte.id = id;
  if (festschreiben && !werte.posten.length) {
    melden("Ohne Positionen lässt sich nichts festschreiben.", true); return;
  }
  const r = await versuche(async () => {
    await sende("/api/rechnungen", werte);
    if (festschreiben) await sende(`/api/rechnung/${id}/festschreiben`, {});
    return true;
  }, festschreiben ? "Festgeschrieben – die Nummer steht jetzt fest." : "Gespeichert.");
  if (r) {
    Z.start = await hole("/api/start");
    if (festschreiben) { dialogZu(); await zeige("rechnungen"); dialogRechnung(id); }
    else dialogRechnung(id);
  }
}

function rechnungLoeschen(id) {
  frageNach("Entwurf löschen?", "Nur Entwürfe lassen sich löschen – festgeschriebene Belege nie.",
    "Löschen", async () => {
      const r = await versuche(() => sende(`/api/rechnung/${id}`, {}, "DELETE"), "Entwurf gelöscht.");
      if (r) { dialogZu(); zeige("rechnungen"); }
    }, true);
}

function rechnungStornieren(id) {
  dialog("Rechnungskorrektur erstellen", `
    <p style="margin-top:0">Die ursprüngliche Rechnung bleibt unverändert bestehen – so verlangt
      es die GoBD. Zusätzlich entsteht eine Korrektur mit umgekehrtem Vorzeichen und eigener Nummer.</p>
    <label class="feld"><span>Grund (erscheint auf der Korrektur)</span>
      <textarea id="stornogrund" style="min-height:70px"
        placeholder="Die Rechnung wurde versehentlich doppelt gestellt."></textarea></label>`,
    `<button class="knopf still" onclick="dialogZu()">Abbrechen</button>
     <button class="knopf gefahr" onclick="stornoAusfuehren(${id})">Korrektur erstellen</button>`);
}

async function stornoAusfuehren(id) {
  const grund = document.getElementById("stornogrund").value;
  const r = await versuche(() => sende(`/api/rechnung/${id}/storno`, { grund }),
    "Rechnungskorrektur angelegt.");
  if (r) { dialogZu(); Z.start = await hole("/api/start"); await zeige("rechnungen"); dialogRechnung(r.id); }
}

async function mahnstufeHoch(id) {
  await versuche(() => sende(`/api/rechnung/${id}/mahnen`, {}));
  setTimeout(() => { Z.start && neuLaden(); }, 900);
}

async function angebotAnnehmen(id) {
  const r = await versuche(() => sende(`/api/rechnung/${id}/annehmen`, {}),
    "Angebot angenommen – der Auftrag steht.");
  if (r) { dialogZu(); Z.start = await hole("/api/start"); zeige("auftraege", r.auftrag_id); }
}

async function angebotAblehnen(id) {
  const r = await versuche(() => sende(`/api/rechnung/${id}/ablehnen`, {}), "Als abgelehnt vermerkt.");
  if (r) { dialogZu(); zeige("rechnungen"); }
}

/* ---- Belege ---- */

async function dialogBeleg(id, kundeId, auftragId) {
  const kunden = (await hole("/api/kunden")).kunden;
  window._belegDatei = null;
  dialog("Beleg erfassen", `
    <form id="belegform" onsubmit="return false">
      <div class="gitter g3" style="margin-bottom:14px">
        <label class="feld"><span>Datum</span><input type="date" name="datum" value="${heute()}"></label>
        <label class="feld"><span>Betrag</span>
          <input type="number" name="betrag" step="0.01" min="0" value=""></label>
        <label class="feld"><span>Kategorie</span>
          <select name="kategorie">
            ${["Fahrtkosten", "Material", "Software", "Miete", "Versicherung", "Telefon und Internet",
               "Fortbildung", "Bewirtung", "Porto", "Sonstiges"].map(k => `<option>${k}</option>`).join("")}
          </select></label>
      </div>
      <label class="feld" style="margin-bottom:14px"><span>Wofür?</span>
        <input type="text" name="beschreibung" placeholder="Sprit für die Fahrt nach Bielefeld"></label>
      <label class="feld" style="margin-bottom:14px"><span>Gehört zu welchem Kunden?</span>
        <select name="kunde_id">
          <option value="">– keinem, allgemeine Ausgabe –</option>
          ${kunden.map(k => `<option value="${k.id}" ${String(kundeId) === String(k.id) ? "selected" : ""}>
            ${e(k.nummer)} · ${e(k.name)}</option>`).join("")}
        </select></label>
      <label class="reihe" style="cursor:pointer; margin-bottom:14px">
        <input type="checkbox" name="weiterberechnen" checked>
        <span>Dem Kunden weiterberechnen – landet automatisch in seiner nächsten Rechnung</span>
      </label>
      <div class="abwerfen" onclick="belegDateiWaehlen()" id="belegdatei">
        ${icon("papier", 18)} Foto oder PDF des Belegs anhängen (freiwillig)
      </div>
      <div class="hilfe" style="margin-top:8px">Die Datei wird beim Speichern automatisch umbenannt: Datum, Betrag, Kategorie, Wofür.</div>
    </form>`,
    `<button class="knopf still" onclick="dialogZu()">Abbrechen</button>
     <button class="knopf haupt" onclick="belegSpeichern(${auftragId || "null"})">Speichern</button>`);
}

function belegDateiWaehlen() {
  dateiWaehlen("image/*,application/pdf", (name, inhalt) => {
    window._belegDatei = { name, inhalt };
    document.getElementById("belegdatei").innerHTML = `${icon("haken", 16)} ${e(name)} angehängt`;
  });
}

async function belegSpeichern(auftragId) {
  const werte = formwerte("belegform");
  if (!werte.betrag) { melden("Der Betrag fehlt.", true); return; }
  werte.kunde_id = werte.kunde_id ? Number(werte.kunde_id) : null;
  werte.auftrag_id = auftragId || null;
  if (window._belegDatei) {
    werte.datei_name = window._belegDatei.name;
    werte.datei_inhalt = window._belegDatei.inhalt;
  }
  const r = await versuche(() => sende("/api/belege", werte), "Beleg gespeichert.");
  if (r) {
    dialogZu(); window._belegDatei = null;
    const [ansicht, id] = Z.ansicht.split(":");
    if (ansicht === "kunden") kundenReiter = "belege";
    zeige(ansicht, id);
  }
}

async function belegLoeschen(id) {
  await versuche(() => sende("/api/belege", { id }, "DELETE"), "Beleg gelöscht.");
  const [ansicht, kid] = Z.ansicht.split(":");
  if (ansicht === "kunden") kundenReiter = "belege";
  zeige(ansicht, kid);
}

<script>
"use strict";

/* ==========================================================================
   Finanzen
   ========================================================================== */

let finanzJahr = new Date().getFullYear(), finanzReiter = "uebersicht";

async function ansichtFinanzen() {
  const d = await hole(`/api/finanzen?jahr=${finanzJahr}`);
  const z = d.euer, s = d.statistik, ein = d.eingang;

  kopf("Finanzen", "Was hereinkommt, was hinausgeht, was zurückgelegt gehört.",
    `<select style="width:auto" onchange="finanzJahr=this.value;zeige('finanzen')">
       ${d.jahre.map(j => `<option value="${j}" ${String(finanzJahr) === String(j) ? "selected" : ""}>${j}</option>`).join("")}

     <button class="knopf" onclick="dialogEinnahme()">${icon("geld", 14)} Geld eingenommen</button>
     <button class="knopf" onclick="dialogAusgabe()">${icon("plus", 14)} Betriebsausgabe</button>
     <button class="knopf haupt" onclick="dialogBeleg()">${icon("papier", 14)} Beleg erfassen</button>`);

  const reiter = [["uebersicht", "Übersicht"], ["geldeingang", "Geldeingang"],
    ["ausgaben", "Ausgaben und Belege"], ["auswertung", "Auswertung"], ["export", "Für den Steuerberater"]];

  malen(`
    <div class="gitter g4" style="margin-bottom:var(--s-4)">
      ${kennzahl("Eingenommen " + finanzJahr, geld(z.einnahmen),
        `${s.anzahl_rechnungen} bezahlte Rechnungen${z.einnahmen_direkt
          ? ` · ${geld(z.einnahmen_direkt)} ohne Rechnung` : ""}`)}
      ${kennzahl("Ausgegeben", geld(z.ausgaben), `${z.kategorien.length} Kategorien`)}
      ${kennzahl("Gewinn", geld(z.gewinn),
        `Einnahmen minus Ausgaben, nach Zufluss`, true)}
      ${kennzahl("Steuerrücklage", geld(z.ruecklage),
        `${zahl(z.ruecklage_satz)} % – ändern in den Einstellungen`)}
    </div>
    <div class="karte">
      <div class="reiter">${reiter.map(([r, name]) => `<button class="${finanzReiter === r ? "aktiv" : ""}"
        onclick="finanzReiter='${r}';zeige('finanzen')">${name}</button>`).join("")}</div>
      <div class="leib">${finanzInhalt(finanzReiter, d)}</div>
    </div>`);
}

function finanzInhalt(reiter, d) {
  const z = d.euer, s = d.statistik, ein = d.eingang;

  if (reiter === "uebersicht") {
    return `<div class="gitter g-2-1">
      <div>
        <h3 style="margin-bottom:10px">Umsatz im Jahresverlauf</h3>
        ${balkendiagramm(s.monate, 160)}
        <div class="mini mute" style="margin-top:8px">Kräftig: ${s.jahr} ·

        <hr class="trenner">
        <div class="gitter g3">
          <div><div class="mute mini">Umsatz gesamt</div><b class="zahl">${geld(s.umsatz)}</b>
            <div class="mini">${veraenderungstext(s.veraenderung)} gegenüber ${s.jahr - 1}</div></div>
          <div><div class="mute mini">Durchschnittliche Rechnung</div>
            <b class="zahl">${geld(s.schnitt_rechnung)}</b></div>
          <div><div class="mute mini">Zahlungsdauer im Schnitt</div>
            <b class="zahl">${s.zahlungsdauer !== null ? zahl(s.zahlungsdauer, 1) + " Tage" : "–"}</b></div>

      <div>
        <h3 style="margin-bottom:10px">Was noch kommt</h3>

          <tr><td>Gestellt und offen</td><td class="r zahl"><b>${geld(ein.gestellt)}</b></td></tr>

          <tr><td>Laufende Aufträge</td><td class="r zahl">${geld(ein.laufend)}</td></tr>
          ${ein.erstattung ? `<tr><td class="runter">noch zu erstatten</td>
            <td class="r zahl runter">− ${geld(ein.erstattung)}</td></tr>` : ""}
          <tr><td>Offene Angebote</td><td class="r zahl mute">${geld(ein.angeboten)}</td></tr>
          <tr><td><b>Voraussichtlich gesamt</b></td><td class="r zahl"><b>${geld(ein.gesamt)}</b></td></tr>
        </tbody></table>
        <div class="mini mute" style="margin-top:8px">Angebote sind nicht mitgerechnet –
          sie sind noch nicht sicher.</div>
        <hr class="trenner">
        <h3 style="margin-bottom:10px">Ausgaben nach Kategorie</h3>
        ${z.kategorien.length ? z.kategorien.map(k => `
          <div style="margin-bottom:9px">
            <div class="reihe klein" style="justify-content:space-between; margin-bottom:3px">

          </div>`).join("") : `<div class="klein mute">Noch nichts erfasst.</div>`}
      </div>
    </div>`;
  }

  if (reiter === "geldeingang") {
    return `<div class="klein mute" style="margin-bottom:12px">Hier hakst du ab, was tatsächlich
        auf dem Konto gelandet ist. Der voraussichtliche Geldeingang auf der Startseite
        rechnet sich dann neu.</div>
      ${d.offene_posten.length ? `<div class="tabellenrolle"><table class="liste">
        <thead><tr><th>Rechnung</th><th>Kunde</th><th>Gestellt</th><th>Fällig</th>
          <th class="r">Betrag</th><th></th></tr></thead>
        <tbody>${d.offene_posten.map(p => `<tr>
          <td><b>${e(p.nummer)}</b>${p.typ === "storno" ? `<div class="mini mute">Korrektur</div>`
            : p.mahnstufe ? `<div class="mini runter">Mahnstufe ${p.mahnstufe}</div>` : ""}</td>
          <td>${e(p.kunde)}</td>
          <td class="klein nowrap">${datum(p.datum)}</td>
          <td class="klein nowrap ${p.ueberfaellig ? "runter" : ""}">${datum(p.faellig_am)}
            ${p.ueberfaellig ? ` (${Math.abs(p.tage)} T.)` : ""}</td>
          <td class="r zahl ${p.typ === "storno" ? "runter" : ""}"><b>${geld(p.betrag)}</b></td>
          <td class="r nowrap">
            <button class="knopf klein" onclick="dialogZahlung(${p.id}, ${p.brutto}, '${p.typ}')">
              ${icon("haken", 12)} ${p.typ === "storno" ? "Erstattet" : "Eingegangen"}</button>
            <button class="knopf klein still" onclick="dialogRechnung(${p.id})">Ansehen</button>
          </td></tr>`).join("")}</tbody></table></div>`
        : leerfeld("geld", "Alles bezahlt. Nichts steht offen.")}
      <hr class="trenner">
      <div class="reihe" style="margin-bottom:12px">
        <div class="wachs">
          <b>Ohne Rechnung eingenommen</b>
          <div class="klein mute">Geld, das nicht über einen Auftrag lief – Selbstbedienungsladen,
            Barverkauf, Markt. Zählt am Tag des Eingangs genauso zum Umsatz.</div>
        </div>
        <button class="knopf klein" onclick="dialogEinnahme()">${icon("plus", 12)} Geldeingang</button>
      </div>
      ${z.direkte_liste.length ? `<div class="tabellenrolle"><table class="liste">
        <thead><tr><th>Datum</th><th>Beleg</th><th>Wovon</th><th>Kategorie</th><th>Bezahlt</th>
          <th>Kunde</th><th class="r">Betrag</th><th></th></tr></thead>
        <tbody>${z.direkte_liste.map(x => `<tr>
          <td class="klein nowrap">${datum(x.datum)}</td>
          <td class="klein mute nowrap">${e(x.beleg_nummer || "")}</td>
          <td>${e(x.beschreibung || "")}${x.dateiname ? ` <a href="/datei/${encodeURIComponent(x.dateiname)}"

          <td class="klein">${e(x.kategorie || "")}</td>
          <td class="klein mute">${e(x.zahlungsart_name || "")}</td>
          <td class="klein mute">${e(x.kunde || "")}</td>
          <td class="r zahl"><b>${geld(x.betrag)}</b></td>
          <td class="r"><button class="knopf klein still" onclick="einnahmeLoeschen(${x.id})"
            title="Löschen">${icon("muell", 12)}</button></td>
        </tr>`).join("")}</tbody>
        <tfoot><tr><td colspan="6" class="r"><b>Summe ${z.jahr}</b></td>
          <td class="r zahl"><b>${geld(z.einnahmen_direkt)}</b></td><td></td></tr></tfoot>
        </table></div>`
        : `<div class="klein mute">In ${z.jahr} noch nichts ohne Rechnung eingenommen.</div>`}`;
  }

  if (reiter === "ausgaben") {
    return `<div class="reihe" style="margin-bottom:12px">
        <div class="wachs klein mute">Belege hängen an einem Kunden, Betriebsausgaben stehen für sich
          (Software, Miete, Versicherung). Beide fließen in die Einnahmen-Überschuss-Rechnung.</div>
        <button class="knopf klein" onclick="dialogBeleg()">${icon("plus", 12)} Beleg</button>
        <button class="knopf klein" onclick="dialogAusgabe()">${icon("plus", 12)} Betriebsausgabe</button>
      </div>
      ${z.ausgaben_liste.length ? `<div class="tabellenrolle"><table class="liste">
        <thead><tr><th>Datum</th><th>Art</th><th>Beschreibung</th><th>Kategorie</th>
          <th>Kunde</th><th class="r">Betrag</th><th></th></tr></thead>

let kalJahr = new Date().getFullYear(), kalMonat = new Date().getMonth() + 1;
let kalTage = [];

/* Klick auf einen Eintrag fuehrt dorthin, wo er bearbeitet wird. Das gilt
   auch fuer die Randtage aus dem Vor- und Folgemonat. */
function eintragOeffnen(art, id) {
  if (!id) return;
  if (art === "termin") return dialogTermin(id);
  if (art === "aufgabe") return dialogAufgabe(id);
  if (art === "rechnung") return dialogRechnung(id);
  if (art === "wiedervorlage") return zeige("kunden", id);
  return zeige("auftraege", id);
}

function kalenderEintrag(x, mitZusatz) {
  return `<div class="kalendereintrag klickbar ${e(x.art)}"
    onclick="event.stopPropagation(); eintragOeffnen('${e(x.art)}', ${x.id || "null"})"
    title="${e(x.titel)}${x.zusatz ? " · " + e(x.zusatz) : ""}">${e(x.titel)}${
      mitZusatz && x.zusatz ? ` · ${e(x.zusatz)}` : ""}</div>`;
}

/* Ein Tag mit mehr als vier Eintraegen zeigt den Rest in einem kleinen Fenster. */
function tagOeffnen(datum) {
  const tag = kalTage.find(t => t.datum === datum);
  if (!tag) return;
  dialog(datumLang(datum),
    `<div class="stapel" style="gap:6px">
       ${tag.eintraege.map(x => kalenderEintrag(x, true)).join("")}
     </div>`,
    `<button class="knopf still" onclick="dialogZu()">Schließen</button>
     <button class="knopf haupt" onclick="dialogZu(); dialogTermin(null,'${datum}')">
       Termin an diesem Tag</button>`);
}

function datumLang(iso) {
  const wt = ["Sonntag", "Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag"];
  const mo = ["Januar", "Februar", "März", "April", "Mai", "Juni", "Juli", "August",
              "September", "Oktober", "November", "Dezember"];
  const d = new Date(iso + "T12:00:00");
  return `${wt[d.getDay()]}, ${d.getDate()}. ${mo[d.getMonth()]} ${d.getFullYear()}`;
}

async function ansichtKalender() {
  const d = await hole(`/api/kalender?jahr=${kalJahr}&monat=${kalMonat}`);
  const m = d.monat;

  kalTage = m.raster.flat();

  kopf("Kalender", "Termine, Abgaben, Zahlungsfristen und Wiedervorlagen an einem Ort. "
    + "Die blassen Tage am Rand gehören zum Nachbarmonat und lassen sich genauso benutzen.",
    `<a class="knopf" href="/kalender.ics" title="In Apple Kalender oder Google Kalender laden">
       ${icon("runter", 14)} In den Kalender laden</a>
     <button class="knopf haupt" onclick="dialogTermin()">${icon("plus", 14)} Neuer Termin</button>`);

  const wochentage = ["Mo", "Di", "Mi", "Do", "Fr", "Sa", "So"];
  malen(`
    <div class="gitter g-2-1">
      <div class="karte">
        <div class="kopf">
          <button class="knopf klein still" onclick="monatWechseln(-1)"
            aria-label="Vorheriger Monat">${icon("links", 14)}</button>
          <h2 style="flex:0; white-space:nowrap; min-width:150px; text-align:center">
            ${e(m.name)} ${m.jahr}</h2>
          <button class="knopf klein still" onclick="monatWechseln(1)"
            aria-label="Nächster Monat">${icon("rechts", 14)}</button>
          <div class="wachs"></div>
          <button class="knopf klein" onclick="kalJahr=${new Date().getFullYear()};
            kalMonat=${new Date().getMonth() + 1};zeige('kalender')">Heute</button>
        </div>
        <div class="leib">
          <div class="kalendergitter">
            ${wochentage.map(t => `<div class="wochentag">${t}</div>`).join("")}
            ${kalTage.map(tag => `
              <div class="kalendertag ${tag.fremd ? "fremd" : ""} ${tag.heute ? "heute" : ""}"
                onclick="dialogTermin(null,'${tag.datum}')"
                title="${e(datumLang(tag.datum))} – klicken für einen neuen Termin">
                <div class="nr">${tag.tag}${
                  tag.monatskuerzel ? `<span class="nachbar">${e(tag.monatskuerzel)}</span>` : ""}</div>
                ${tag.eintraege.slice(0, 4).map(x => kalenderEintrag(x)).join("")}
                ${tag.eintraege.length > 4
                  ? `<button class="mehr" onclick="event.stopPropagation(); tagOeffnen('${tag.datum}')">
                       + ${tag.eintraege.length - 4} weitere</button>` : ""}
              </div>`).join("")}
          </div>
          <div class="reihe-weit mini mute" style="margin-top:12px">
            <span class="kalendereintrag termin">Termin</span>
            <span class="kalendereintrag">Auftrag</span>
            <span class="kalendereintrag rechnung">Zahlungsfrist</span>
            <span class="kalendereintrag aufgabe">Aufgabe</span>
            <span class="kalendereintrag wiedervorlage">Wiedervorlage</span>
          </div>
        </div>
      </div>
      <div class="karte">
        <div class="kopf"><h2>Die nächsten drei Wochen</h2></div>
        <div class="leib eng">
          ${d.naechste.length ? d.naechste.map(t => `
            <div style="padding:9px 0; border-bottom:1px solid var(--hair)">
              <div class="klein mute" style="margin-bottom:4px">${e(t.lang)}</div>
              <div class="stapel" style="gap:3px">
                ${t.eintraege.map(x => kalenderEintrag(x, true)).join("")}
              </div>
            </div>`).join("") : leerfeld("kalender", "Nichts geplant.")}
        </div>
      </div>
    </div>`);
}

  kalMonat += richtung;

  if (kalMonat > 12) { kalMonat = 1; kalJahr++; }
  zeige("kalender");
}
