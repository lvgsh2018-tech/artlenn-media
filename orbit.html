const FARBEN = Object.keys(FARBNAME);

function beitragKachel(b, mitKanal) {
  return `<div class="beitrag f-${e(b.farbe)} st-${e(b.status)}" draggable="true"
    ondragstart="beitragZiehen(event, ${b.id})"
    onclick="event.stopPropagation(); dialogBeitrag(${b.id})"
    title="${e(b.account)} · ${e(FORMATNAME[b.format] || b.format)} · ${e(STANDNAME[b.status] || b.status)}${
      b.uhrzeit ? " · " + e(b.uhrzeit) + " Uhr" : ""}\n${e(b.titel)}">
    ${mitKanal ? `<span class="kanalpunkt"></span>` : ""}
    ${b.uhrzeit ? `<span class="zeit">${e(b.uhrzeit)}</span>` : ""}
    <span class="txt">${e(b.titel)}${mitKanal ? ` · ${e(b.account)}` : ""}</span>
  </div>`;
}

/* Verschieben per Ziehen. Wer nicht ziehen mag, ändert das Datum im Fenster. */
function beitragZiehen(ev, id) {
  ev.dataTransfer.setData("text/plain", String(id));
  ev.dataTransfer.effectAllowed = "move";
}

async function beitragAblegen(ev, datum) {
  ev.preventDefault();
  const id = Number(ev.dataTransfer.getData("text/plain"));
  if (!id) return;
  const r = await versuche(() => sende("/api/content/beitrag", { id, datum }),
    "Auf den " + datum.slice(8, 10) + "." + datum.slice(5, 7) + ". verschoben.");
  if (r) zeige("content");
}

async function ansichtContent() {
  const d = await hole(`/api/content?jahr=${conJahr}&monat=${conMonat}`
    + `&kanaele=${conKanaele.join(",")}`);
  const m = d.monat;
  conTage = m.raster.flat();
  conAccounts = d.accounts;

  const stand = Object.entries(m.nach_stand).filter(([, n]) => n)
    .map(([s, n]) => `${n} ${STANDNAME[s] || s}`).join(" · ");

  kopf("Contentplanung",
    conAccounts.length
      ? `${m.anzahl} ${m.anzahl === 1 ? "Beitrag" : "Beiträge"} im ${e(m.name)}${stand ? " · " + stand : ""}`
      : "Erst die Kanäle anlegen, dann lässt sich planen.",
    `<button class="knopf" onclick="dialogKanaele()">${icon("kunden", 14)} Kanäle</button>
     <button class="knopf haupt" onclick="dialogBeitrag()" ${conAccounts.length ? "" : "disabled"}>
       ${icon("plus", 14)} Neuer Beitrag</button>`);

  if (!conAccounts.length) {
    malen(`<div class="karte"><div class="leib">${leerfeld("content",
      "Noch kein Kanal angelegt. Ein Kanal ist ein Konto, für das du planst – "
      + "etwa ein Instagram-Profil, eine Facebook-Seite oder der Newsletter. "
      + "Jeder bekommt seine eigene Farbe.",
      `<button class="knopf haupt" onclick="dialogKanal()">${icon("plus", 14)} Ersten Kanal anlegen</button>`)}
      </div></div>`);
    return;
  }

  const filter = conAccounts.filter(a => a.aktiv).map(a => `
    <button class="kanalchip f-${e(a.farbe)} ${conKanaele.includes(a.id) ? "an" : ""}"
      onclick="kanalFilter(${a.id})" aria-pressed="${conKanaele.includes(a.id)}">
      <span class="kanalpunkt"></span>${e(a.name)}
      <span class="zahl">${m.verteilung[a.name] || 0}</span>
    </button>`).join("");

  const wochentage = ["Mo", "Di", "Mi", "Do", "Fr", "Sa", "So"];

  malen(`
    <div class="gitter g-2-1">
      <div class="karte">
        <div class="kopf">
          <button class="knopf klein still" onclick="contentMonat(-1)"
            aria-label="Vorheriger Monat">${icon("links", 14)}</button>
          <h2 style="flex:0; white-space:nowrap; min-width:150px; text-align:center">
            ${e(m.name)} ${m.jahr}</h2>
          <button class="knopf klein still" onclick="contentMonat(1)"
            aria-label="Nächster Monat">${icon("rechts", 14)}</button>
          <div class="wachs"></div>
          <button class="knopf klein" onclick="conJahr=${new Date().getFullYear()};
            conMonat=${new Date().getMonth() + 1};zeige('content')">Heute</button>
        </div>
        <div class="leib">
          <div class="reihe-weit" style="gap:6px; margin-bottom:14px">
            ${filter}
            ${conKanaele.length
              ? `<button class="knopf klein still" onclick="conKanaele=[];zeige('content')">
                   Filter aufheben</button>` : ""}
          </div>
          <div class="kalendergitter">
            ${wochentage.map(t => `<div class="wochentag">${t}</div>`).join("")}
            ${conTage.map(tag => `
              <div class="kalendertag ${tag.fremd ? "fremd" : ""} ${tag.heute ? "heute" : ""}"
                onclick="dialogBeitrag(null,'${tag.datum}')"
                ondragover="event.preventDefault()"
                ondrop="beitragAblegen(event,'${tag.datum}')"
                title="${e(datumLang(tag.datum))} – klicken für einen neuen Beitrag">
                <div class="nr">${tag.tag}${
                  tag.monatskuerzel ? `<span class="nachbar">${e(tag.monatskuerzel)}</span>` : ""}</div>
                ${tag.eintraege.slice(0, 4).map(b => beitragKachel(b)).join("")}
                ${tag.eintraege.length > 4
                  ? `<button class="mehr" onclick="event.stopPropagation(); contentTag('${tag.datum}')">
                       + ${tag.eintraege.length - 4} weitere</button>` : ""}
              </div>`).join("")}
          </div>
          <div class="reihe-weit mini mute" style="margin-top:12px">
            <span>Farbe = Kanal.</span>
            <span class="beitrag f-grau st-geplant" style="cursor:default"><span class="txt">Idee &amp; Geplant</span></span>
            <span class="beitrag f-grau st-fertig" style="cursor:default"><span class="txt">Fertig</span></span>
            <span>Zum Verschieben einen Beitrag auf einen anderen Tag ziehen.</span>
          </div>
        </div>
      </div>

      <div class="stapel">
        <div class="karte">
          <div class="kopf"><h2>Als Nächstes</h2></div>
          <div class="leib eng">
            ${d.naechste.length ? d.naechste.map(t => `
              <div style="padding:9px 0; border-bottom:1px solid var(--hair)">
                <div class="klein mute" style="margin-bottom:4px">${e(t.lang)}</div>
                <div class="stapel" style="gap:3px">
                  ${t.eintraege.map(b => beitragKachel(b, true)).join("")}
                </div>
              </div>`).join("")
              : leerfeld("content", "In den nächsten drei Wochen ist nichts eingeplant.")}
          </div>
        </div>
        <div class="karte">
          <div class="kopf"><h2>Ideenspeicher</h2>
            <span class="klein mute">${d.ohne_datum.length} ohne Datum</span></div>
          <div class="leib eng">
            ${d.ohne_datum.length
              ? `<div class="stapel" style="gap:4px">
                   ${d.ohne_datum.map(b => beitragKachel(b, true)).join("")}</div>
                 <p class="mini mute" style="margin:10px 0 0">
                   Eine Idee bekommt ein Datum, sobald du sie anklickst und eintragen willst.</p>`
              : `<p class="mini mute" style="margin:0">Hier landen Beiträge, die noch kein Datum
                   haben. Lass beim Anlegen einfach das Datum leer.</p>`}
          </div>
        </div>
      </div>
    </div>`);
}

function contentMonat(richtung) {
  conMonat += richtung;
  if (conMonat < 1) { conMonat = 12; conJahr--; }
  if (conMonat > 12) { conMonat = 1; conJahr++; }
  zeige("content");
}

function kanalFilter(id) {
  conKanaele = conKanaele.includes(id) ? conKanaele.filter(x => x !== id) : conKanaele.concat(id);
  zeige("content");
}

function contentTag(datum) {
  const tag = conTage.find(t => t.datum === datum);
  if (!tag) return;
  dialog(datumLang(datum),
    `<div class="stapel" style="gap:5px">${tag.eintraege.map(b => beitragKachel(b, true)).join("")}</div>`,
    `<button class="knopf still" onclick="dialogZu()">Schließen</button>
     <button class="knopf haupt" onclick="dialogZu(); dialogBeitrag(null,'${datum}')">
       Beitrag an diesem Tag</button>`);
}

/* ---- Ein einzelner Beitrag ---- */

async function dialogBeitrag(id, vorgabe) {
  const d = await hole(`/api/content?jahr=${conJahr}&monat=${conMonat}`);
  const aktive = d.accounts.filter(a => a.aktiv);
  if (!aktive.length) { melden("Leg zuerst einen Kanal an.", true); return dialogKanal(); }

  // Voreinstellung: der Kanal, auf dem das meiste laeuft. Fehlt er, der erste.
  const standardkanal = aktive.find(a => a.name === "Bad Salzuflen News") || aktive[0];
  let b = { datum: vorgabe === undefined ? heute() : vorgabe, status: "idee", format: "post",
            account_id: standardkanal.id, uhrzeit: "" };
  if (id) b = (await hole(`/api/content/beitrag/${id}`)).beitrag || b;

  const kunden = (await hole("/api/kunden")).kunden;
  dialog(id ? "Beitrag bearbeiten" : "Neuer Beitrag", `
    <form id="beitragform" onsubmit="return false">
      <div class="gitter g2" style="margin-bottom:14px">
        <label class="feld"><span>Kanal</span>
          <select name="account_id" onchange="beitragFarbeZeigen()">
            ${aktive.map(a => `<option value="${a.id}" data-farbe="${e(a.farbe)}"
              ${String(b.account_id) === String(a.id) ? "selected" : ""}>
              ${e(a.name)} · ${e(PLATTFORMNAME[a.plattform] || a.plattform)}</option>`).join("")}
          </select></label>
        <label class="feld"><span>Worum geht es?</span>
          <input type="text" name="titel" value="${e(b.titel || "")}"
            placeholder="Reel vom Kurpark-Dreh"></label>
      </div>
      <div class="reihe" style="margin-bottom:14px">
        <span class="kanalpunkt" id="beitragfarbe" style="width:12px;height:12px;flex:0 0 12px"></span>
        <span class="mini mute" id="beitragfarbetext"></span>
      </div>
      <div class="gitter g2" style="margin-bottom:14px">
        <label class="feld"><span>Datum <span class="mute">(leer = Ideenspeicher)</span></span>
          <input type="date" name="datum" value="${e(b.datum || "")}"></label>
        <label class="feld"><span>Uhrzeit</span>
          <input type="time" name="uhrzeit" value="${e(b.uhrzeit || "")}"></label>
      </div>
      <div class="gitter g2" style="margin-bottom:14px">
        <label class="feld"><span>Format</span><select name="format">
          ${Object.entries(FORMATNAME).map(([w, n]) => `<option value="${w}"
            ${(b.format || "post") === w ? "selected" : ""}>${n}</option>`).join("")}
        </select></label>
        <label class="feld"><span>Stand</span><select name="status">
          ${Object.entries(STANDNAME).map(([w, n]) => `<option value="${w}"
            ${(b.status || "idee") === w ? "selected" : ""}>${n}</option>`).join("")}
        </select></label>
      </div>
      <label class="feld" style="margin-bottom:14px"><span>Bildunterschrift</span>
        <textarea name="text" rows="4"
          placeholder="Der Text, der später unter dem Beitrag steht.">${e(b.text || "")}</textarea></label>
      <div class="gitter g2">
        <label class="feld"><span>Kunde</span><select name="kunde_id">
          <option value="">– keiner –</option>
          ${kunden.map(k => `<option value="${k.id}"
            ${String(b.kunde_id) === String(k.id) ? "selected" : ""}>${e(k.name)}</option>`).join("")}
        </select></label>
        <label class="feld"><span>Notiz für dich</span>
          <input type="text" name="notiz" value="${e(b.notiz || "")}"></label>
      </div>
    </form>`,
    `${id ? `<button class="knopf gefahr" onclick="beitragLoeschen(${id})">Löschen</button>` : ""}
     <div class="wachs"></div>
     <button class="knopf still" onclick="dialogZu()">Abbrechen</button>
     <button class="knopf haupt" onclick="beitragSpeichern(${id || "null"})">Speichern</button>`);
  beitragFarbeZeigen();
}

function beitragFarbeZeigen() {
  const wahl = document.querySelector("#beitragform [name=account_id]");
  const punkt = document.getElementById("beitragfarbe");
  const text = document.getElementById("beitragfarbetext");
  if (!wahl || !punkt) return;
  const farbe = wahl.selectedOptions[0].dataset.farbe || "grau";
  punkt.className = "kanalpunkt f-" + farbe;
  text.textContent = "Erscheint im Kalender in " + (FARBNAME[farbe] || farbe) + ".";
}

async function beitragSpeichern(id) {
  const werte = formwerte("beitragform");
  if (!werte.titel.trim()) { melden("Der Beitrag braucht einen Titel.", true); return; }
  werte.account_id = werte.account_id ? Number(werte.account_id) : null;
  werte.kunde_id = werte.kunde_id ? Number(werte.kunde_id) : null;
  if (id) werte.id = id;
  const r = await versuche(() => sende("/api/content/beitrag", werte), "Beitrag gespeichert.");
  if (r) { dialogZu(); zeige(Z.ansicht.split(":")[0]); }
}

async function beitragLoeschen(id) {
  const r = await versuche(() => sende("/api/content/beitrag", { id }, "DELETE"), "Beitrag gelöscht.");
  if (r) { dialogZu(); zeige(Z.ansicht.split(":")[0]); }
}

/* ---- Kanäle verwalten ---- */

async function dialogKanaele() {
  const liste = (await hole("/api/content")).accounts;
  dialog("Kanäle", liste.length ? `
    <div>${liste.map(a => `
      <div class="kanalzeile f-${e(a.farbe)} ${a.aktiv ? "" : "still"}">
        <span class="balken"></span>
        <div class="wachs">
          <div style="font-weight:550">${e(a.name)}${a.aktiv ? "" : " · stillgelegt"}</div>
          <div class="mini mute">${e(PLATTFORMNAME[a.plattform] || a.plattform)}
            · ${a.beitraege} ${a.beitraege === 1 ? "Beitrag" : "Beiträge"}
            · ${e(FARBNAME[a.farbe] || a.farbe)}</div>
        </div>
        <button class="knopf klein still" onclick="dialogKanal(${a.id})"
          aria-label="Bearbeiten">${icon("stift", 13)}</button>
        <button class="knopf klein still" onclick="kanalLoeschen(${a.id}, '${e(a.name)}', ${a.beitraege})"
          aria-label="Löschen">${icon("muell", 13)}</button>
      </div>`).join("")}</div>`
    : `<p class="mute" style="margin:0">Noch kein Kanal angelegt.</p>`,
    `<button class="knopf" onclick="dialogKanal()">${icon("plus", 14)} Kanal hinzufügen</button>
     <div class="wachs"></div>
     <button class="knopf haupt" onclick="dialogZu(); zeige('content')">Fertig</button>`);
}

async function dialogKanal(id) {
  const liste = (await hole("/api/content")).accounts;
  const a = id ? (liste.find(x => x.id === id) || {}) : {};
  conBelegt = liste.filter(x => x.id !== id).map(x => x.farbe);
  conFarbe = a.farbe || FARBEN.find(f => !conBelegt.includes(f)) || "blau";
  const kunden = (await hole("/api/kunden")).kunden;

  dialog(id ? "Kanal bearbeiten" : "Neuer Kanal", `
    <form id="kanalform" onsubmit="return false">
      <div class="gitter g2" style="margin-bottom:14px">
        <label class="feld"><span>Name</span>
          <input type="text" name="name" value="${e(a.name || "")}"
            placeholder="@badsalzuflen_bilder"></label>
        <label class="feld"><span>Wo?</span><select name="plattform">
          ${Object.entries(PLATTFORMNAME).map(([w, n]) => `<option value="${w}"
            ${(a.plattform || "instagram") === w ? "selected" : ""}>${n}</option>`).join("")}
        </select></label>
      </div>
      <div class="feld" style="margin-bottom:14px">
        <span>Farbe im Kalender</span>
        <div class="farbwahl" style="margin-top:6px" role="group" aria-label="Farbe wählen">
          ${FARBEN.map(f => `<button type="button"
            class="f-${f} ${conBelegt.includes(f) ? "belegt" : ""} ${f === conFarbe ? "an" : ""}"
            onclick="kanalFarbe('${f}')"
            title="${FARBNAME[f]}${conBelegt.includes(f) ? " – schon vergeben" : ""}"
            aria-label="${FARBNAME[f]}">${icon("haken", 13)}</button>`).join("")}
        </div>
        <div class="mini mute" id="farbhinweis" style="margin-top:6px"></div>
      </div>
      <input type="hidden" name="farbe" id="kanalfarbe" value="${e(conFarbe)}">
      <div class="gitter g2" style="margin-bottom:14px">
        <label class="feld"><span>Gehört zu Kunde</span><select name="kunde_id">
          <option value="">– niemandem, ist mein eigener –</option>
          ${kunden.map(k => `<option value="${k.id}"
            ${String(a.kunde_id) === String(k.id) ? "selected" : ""}>${e(k.name)}</option>`).join("")}
        </select></label>
        <label class="feld"><span>Notiz</span>
          <input type="text" name="notiz" value="${e(a.notiz || "")}"></label>
      </div>
      <label class="reihe klein" style="gap:8px">
        <input type="checkbox" name="aktiv" ${a.id === undefined || a.aktiv ? "checked" : ""}>
        Kanal wird aktiv bespielt</label>
    </form>`,
    `<button class="knopf still" onclick="dialogKanaele()">Zurück</button>
     <div class="wachs"></div>
     <button class="knopf haupt" onclick="kanalSpeichern(${id || "null"})">Speichern</button>`);
  kanalFarbe(conFarbe);
}

function kanalFarbe(farbe) {
  conFarbe = farbe;
  document.getElementById("kanalfarbe").value = farbe;
  document.querySelectorAll(".farbwahl button").forEach(b =>
    b.classList.toggle("an", b.classList.contains("f-" + farbe)));
  const hinweis = document.getElementById("farbhinweis");
  if (hinweis) {
    const doppelt = conBelegt.includes(farbe);
    hinweis.textContent = (FARBNAME[farbe] || farbe)
      + (doppelt ? " – die hat schon ein anderer Kanal. Geht, ist aber schwerer auseinanderzuhalten."
                 : " – noch frei.");
  }
}

async function kanalSpeichern(id) {
  const werte = formwerte("kanalform");
  if (!werte.name.trim()) { melden("Der Kanal braucht einen Namen.", true); return; }
  werte.kunde_id = werte.kunde_id ? Number(werte.kunde_id) : null;
  if (id) werte.id = id;
  const r = await versuche(() => sende("/api/content/account", werte), "Kanal gespeichert.");
  if (r) { await dialogKanaele(); }
}

async function kanalLoeschen(id, name, anzahl) {
  frageNach("Kanal löschen",
    `„${e(name)}“ wird entfernt.` + (anzahl
      ? ` Die ${anzahl} ${anzahl === 1 ? "geplante Beitrag bleibt" : "geplanten Beiträge bleiben"}
          stehen, ${anzahl === 1 ? "steht" : "stehen"} danach aber ohne Kanal da.`
      : ""),
    "Löschen", async () => {
      await versuche(() => sende("/api/content/account", { id }, "DELETE"), "Kanal gelöscht.");
      conKanaele = conKanaele.filter(x => x !== id);
      await dialogKanaele();
    }, true);
}

/* ==========================================================================
   Aufgaben
   ========================================================================== */

let aufgabenAlle = false;

async function ansichtAufgaben() {
  const d = await hole("/api/aufgaben");
  const offen = d.aufgaben.filter(a => !a.erledigt);
  const erledigt = d.aufgaben.filter(a => a.erledigt);
  const liste = aufgabenAlle ? d.aufgaben : offen;

  kopf("Aufgaben", `${offen.length} offen · wiederkehrende Fristen legen sich nach dem Abhaken neu an`,
    `<button class="knopf haupt" onclick="dialogAufgabe()">${icon("plus", 14)} Neue Aufgabe</button>`);

  const zeile = (a) => `
    <div class="reihe" style="padding:10px 0; border-bottom:1px solid var(--hair); align-items:flex-start">
      <input type="checkbox" style="margin-top:3px" ${a.erledigt ? "checked" : ""}
        onchange="aufgabeUmschalten(${a.id}, this.checked)" aria-label="Erledigt">
      <div class="wachs">
        <div style="${a.erledigt ? "text-decoration:line-through; color:var(--mute)" : ""}">
          ${a.wichtig ? `<span class="stand rot" style="margin-right:6px">wichtig</span>` : ""}
          ${e(a.titel)}</div>
        ${a.beschreibung ? `<div class="klein mute">${e(a.beschreibung)}</div>` : ""}
        <div class="mini mute" style="margin-top:2px">
          ${a.faellig ? `<span class="${!a.erledigt && a.faellig < heute() ? "runter" : ""}">
            fällig ${datum(a.faellig)}${a.uhrzeit ? `, ${e(a.uhrzeit)} Uhr` : ""}</span>` : "ohne Frist"}
          ${a.rhythmus ? ` · wiederholt sich ${{ monatlich: "monatlich", quartalsweise: "quartalsweise",
            jaehrlich: "jährlich" }[a.rhythmus]}` : ""}
          ${a.firma || a.nachname ? ` · ${e(a.firma || a.nachname)}` : ""}
        </div>
      </div>
      <button class="knopf klein still" onclick="dialogAufgabe(${a.id})">${icon("stift", 12)}</button>
      <button class="knopf klein still" onclick="aufgabeLoeschen(${a.id})">${icon("muell", 12)}</button>
    </div>`;

  malen(`
    <div class="gitter g-2-1">
      <div class="karte">
        <div class="kopf"><h2>${aufgabenAlle ? "Alle Aufgaben" : "Offene Aufgaben"}</h2>
          <div class="wachs"></div>
          <label class="reihe klein mute" style="cursor:pointer">
            <input type="checkbox" ${aufgabenAlle ? "checked" : ""}
              onchange="aufgabenAlle=this.checked;zeige('aufgaben')"> Erledigte mitzeigen</label>
        </div>
        <div class="leib">
          ${liste.length ? liste.map(zeile).join("")
            : leerfeld("aufgaben", "Nichts offen. Sauber.",
              `<button class="knopf" onclick="dialogAufgabe()">Aufgabe anlegen</button>`)}
        </div>
      </div>
      <div class="karte">
        <div class="kopf"><h2>Wiederkehrende Fristen</h2></div>
        <div class="leib">
          <div class="klein mute" style="margin-bottom:12px">Typische Termine im Jahreslauf eines
            Kleinunternehmens. Ein Klick legt sie als wiederkehrende Aufgabe an.</div>
          ${d.vorschlaege.map(v => `
            <div style="padding:9px 0; border-bottom:1px solid var(--hair)">
              <div class="reihe">
                <div class="wachs">
                  <div>${e(v.titel)}</div>
                  <div class="mini mute">${datum(v.faellig)} ·
                    ${{ monatlich: "monatlich", quartalsweise: "quartalsweise", jaehrlich: "jährlich" }[v.rhythmus]}</div>
                </div>
                <button class="knopf klein" onclick='fristUebernehmen(${JSON.stringify(v).replace(/'/g, "&#39;")})'>
                  ${icon("plus", 12)}</button>
              </div>
              <div class="mini mute" style="margin-top:3px">${e(v.beschreibung)}</div>
            </div>`).join("")}
        </div>
      </div>
    </div>`);
}

async function fristUebernehmen(v) {
  const r = await versuche(() => sende("/api/aufgaben", v), "Frist übernommen.");
  if (r) { Z.start = await hole("/api/start"); zeige("aufgaben"); }
}

async function aufgabeUmschalten(id, erledigt) {
  await versuche(() => sende("/api/aufgaben", { id, erledigt: erledigt ? 1 : 0 }));
  Z.start = await hole("/api/start");
  zeige("aufgaben");
}

async function aufgabeLoeschen(id) {
  await versuche(() => sende("/api/aufgaben", { id }, "DELETE"), "Aufgabe gelöscht.");
  zeige("aufgaben");
}

async function dialogAufgabe(id) {
  let a = { faellig: "", uhrzeit: "" };
  if (id) {
    const alle = (await hole("/api/aufgaben")).aufgaben;
    a = alle.find(x => x.id === id) || a;
  }
  const kunden = (await hole("/api/kunden")).kunden;
  dialog(id ? "Aufgabe bearbeiten" : "Neue Aufgabe", `
    <form id="aufgabenform" onsubmit="return false">
      <label class="feld" style="margin-bottom:14px"><span>Was ist zu tun?</span>
        <input type="text" name="titel" value="${e(a.titel || "")}"></label>
      <label class="feld" style="margin-bottom:14px"><span>Nähere Beschreibung</span>
        <textarea name="beschreibung" style="min-height:60px">${e(a.beschreibung || "")}</textarea></label>
      <div class="gitter g3" style="margin-bottom:14px">
        <label class="feld"><span>Fällig am</span>
          <input type="date" name="faellig" value="${e(a.faellig || "")}"></label>
        <label class="feld"><span>Uhrzeit</span>
          <input type="time" name="uhrzeit" value="${e(a.uhrzeit || "")}"></label>
        <label class="feld"><span>Wiederholung</span><select name="rhythmus">
          <option value="">keine</option>
          ${[["monatlich", "monatlich"], ["quartalsweise", "quartalsweise"], ["jaehrlich", "jährlich"]]
            .map(([w, n]) => `<option value="${w}" ${a.rhythmus === w ? "selected" : ""}>${n}</option>`).join("")}
        </select></label>
      </div>
      <label class="feld" style="margin-bottom:14px"><span>Kunde</span><select name="kunde_id">
        <option value="">– keiner –</option>
        ${kunden.map(k => `<option value="${k.id}" ${String(a.kunde_id) === String(k.id) ? "selected" : ""}>
          ${e(k.name)}</option>`).join("")}</select></label>
      <label class="reihe" style="cursor:pointer">
        <input type="checkbox" name="wichtig" ${a.wichtig ? "checked" : ""}> <span>Wichtig</span></label>
    </form>`,
    `<button class="knopf still" onclick="dialogZu()">Abbrechen</button>
     <button class="knopf haupt" onclick="aufgabeSpeichern(${id || "null"})">Speichern</button>`);
}

async function aufgabeSpeichern(id) {
  const werte = formwerte("aufgabenform");
  if (!werte.titel.trim()) { melden("Die Aufgabe braucht einen Titel.", true); return; }
  werte.kunde_id = werte.kunde_id ? Number(werte.kunde_id) : null;
  if (id) werte.id = id;
  const r = await versuche(() => sende("/api/aufgaben", werte), "Aufgabe gespeichert.");
  if (r) { dialogZu(); Z.start = await hole("/api/start"); zeige(Z.ansicht.split(":")[0]); }
}

        </ul>
      </div>`;
  }

  if (reiter === "protokoll") {
    return `<div class="klein mute" style="margin-bottom:12px">Festgeschriebene Rechnungen,
        Korrekturen und Zahlungseingänge werden mitgeschrieben. Das verlangt die GoBD und hilft,

      ${d.protokoll.length ? `<div class="tabellenrolle"><table class="liste">
        <thead><tr><th>Zeitpunkt</th><th>Bereich</th><th>Vorgang</th><th>Was</th></tr></thead>

          <td class="klein nowrap mute">${e(String(p.zeit).replace("T", " ").slice(0, 16))}</td>

  return "";

async function einstellungenSpeichern() {
  const werte = formwerte("einstform");
  const r = await versuche(() => sende("/api/einstellungen", werte), "Einstellungen gespeichert.");
  if (r) { Z.start = await hole("/api/start"); zeige("einstellungen"); }
}

function logoWaehlen() {
  dateiWaehlen("image/*", async (name, inhalt) => {
    const feld = document.querySelector('#einstform [name=firma_logo]');
    if (feld) feld.value = inhalt;
    await einstellungenSpeichern();
  });
}

async function logoWeg() {
  const feld = document.querySelector('#einstform [name=firma_logo]');
  if (feld) feld.value = "";
  await einstellungenSpeichern();
}

function dialogLeistung(id) {
  const l = id ? (Z.einst.leistungen || []).find(x => x.id === id) || {} : { einheit: "Stück", steuersatz: 0 };
  dialog(id ? "Leistung bearbeiten" : "Neue Leistung", `
    <form id="leistungsform" onsubmit="return false">
      <label class="feld" style="margin-bottom:14px"><span>Name</span>
        <input type="text" name="name" value="${e(l.name || "")}" placeholder="Videoschnitt"></label>
      <label class="feld" style="margin-bottom:14px"><span>Beschreibung</span>
        <input type="text" name="beschreibung" value="${e(l.beschreibung || "")}"
          placeholder="Rohschnitt, Feinschnitt, Farbkorrektur"></label>
      <div class="gitter g3">
        <label class="feld"><span>Einheit</span>
          <input type="text" name="einheit" value="${e(l.einheit || "Stück")}" list="einheiten">
          <datalist id="einheiten">${["Stück", "Stunde", "Tag", "Pauschale", "Monat", "km", "Wort"]
            .map(x => `<option value="${x}">`).join("")}</datalist></label>
        <label class="feld"><span>Preis</span>
          <input type="number" name="preis" step="0.01" min="0" value="${l.preis || 0}"></label>
        <label class="feld"><span>Steuersatz in %</span>
          <input type="number" name="steuersatz" step="0.1" min="0" value="${l.steuersatz || 0}"></label>
      </div>
    </form>`,
    `<button class="knopf still" onclick="dialogZu()">Abbrechen</button>
     <button class="knopf haupt" onclick="leistungSpeichern(${id || "null"})">Speichern</button>`);
}

async function leistungSpeichern(id) {
  const werte = formwerte("leistungsform");
  if (!werte.name.trim()) { melden("Die Leistung braucht einen Namen.", true); return; }
  if (id) werte.id = id;
  const r = await versuche(() => sende("/api/leistungen", werte), "Leistung gespeichert.");
  if (r) { dialogZu(); einstReiter = "leistungen"; zeige("einstellungen"); }
}

async function leistungLoeschen(id) {
  await versuche(() => sende("/api/leistungen", { id }, "DELETE"), "Leistung gelöscht.");
  einstReiter = "leistungen"; zeige("einstellungen");
}

/* ---- Zurücksetzen ----
   Zwei Hürden vor dem Löschen: die Rückfrage selbst und ein Wort, das von Hand
   getippt werden muss. Erst dann wird der Knopf überhaupt anklickbar. */

const ZURUECK = {
  daten: {
    wort: "DATEN LÖSCHEN",
    titel: "Wirklich alle Daten löschen?",
    knopf: "Daten unwiderruflich löschen",
    weg: ["Kunden mit allen Notizen und Sonderpreisen", "Aufträge, Zeiten und Positionen",
          "Rechnungen, Angebote und Korrekturen", "Belege, Einnahmen und Ausgaben",
          "Termine, Aufgaben und abgelegte Dateien", "das Protokoll"],
    bleibt: ["Firmenprofil, Logo und Bankverbindung", "alle Rechnungseinstellungen und Mahntexte",
             "der Leistungskatalog", "alle bisherigen Sicherungen"]
  },
  alles: {
    wort: "ALLES LÖSCHEN",
    titel: "Wirklich das ganze Programm zurücksetzen?",
    knopf: "Alles unwiderruflich zurücksetzen",
    weg: ["der komplette Datenbestand: Kunden, Aufträge, Rechnungen, Belege, Einnahmen, "
          + "Ausgaben, Termine, Aufgaben, Dateien und Protokoll",
          "Firmenprofil, Logo und Bankverbindung",
          "Steuerangaben, Nummernmuster, Vorlage und Mahntexte",
          "der Leistungskatalog"],
    bleibt: ["alle bisherigen Sicherungen im Ordner „sicherungen“"]
  }
};

function wortRein(text) {
  return String(text || "").trim().toUpperCase()
    .replace(/Ö/g, "OE").replace(/Ä/g, "AE").replace(/Ü/g, "UE")
    .replace(/\s+/g, " ");
}

function dialogZuruecksetzen(umfang) {
  const z = ZURUECK[umfang];
  if (!z) return;
  const liste = (titel, punkte, farbe) => `
    <div style="flex:1; min-width:200px">
      <div class="mini" style="font-weight:600; color:${farbe}; text-transform:uppercase;
        letter-spacing:.04em; margin-bottom:6px">${titel}</div>
      <ul style="margin:0; padding-left:18px" class="klein">
        ${punkte.map(x => `<li style="margin-bottom:3px">${x}</li>`).join("")}</ul>
    </div>`;

  dialog(z.titel, `
    <div class="reihe-weit" style="align-items:flex-start; gap:var(--s-5); margin-bottom:16px">
      ${liste("Wird gelöscht", z.weg, "var(--rot)")}
      ${liste("Bleibt erhalten", z.bleibt, "var(--gruen)")}
    </div>
    <div class="klein" style="background:var(--soft-2); border-radius:var(--r-md);
      padding:10px 12px; margin-bottom:16px">
      Kurz vorher wird automatisch gesichert. Sollte das hier ein Versehen sein, liegt der
      alte Stand als ZIP im Ordner <b>sicherungen</b> und lässt sich zurückholen.
    </div>
    <label class="feld"><span>Zum Bestätigen bitte <b>${z.wort}</b> eintippen</span>
      <input type="text" id="zurueckwort" autocomplete="off" spellcheck="false"
        placeholder="${z.wort}" oninput="zuruecksetzenPruefen('${umfang}')">
      <div class="hilfe">Groß- und Kleinschreibung ist egal.</div></label>`,
    `<button class="knopf still" onclick="dialogZu()">Abbrechen</button>
     <button class="knopf gefahr" id="zurueckknopf" disabled
       onclick="zuruecksetzenAusfuehren('${umfang}')">${z.knopf}</button>`);
}

function zuruecksetzenPruefen(umfang) {
  const feld = document.getElementById("zurueckwort");
  const knopf = document.getElementById("zurueckknopf");
  if (!feld || !knopf) return;
  knopf.disabled = wortRein(feld.value) !== wortRein(ZURUECK[umfang].wort);
}

async function zuruecksetzenAusfuehren(umfang) {
  const feld = document.getElementById("zurueckwort");
  const knopf = document.getElementById("zurueckknopf");
  const bestaetigung = feld ? feld.value : "";
  if (knopf) { knopf.disabled = true; knopf.textContent = "Einen Moment …"; }
  const r = await versuche(() => sende("/api/zuruecksetzen", { umfang, bestaetigung }));
  if (!r) { zuruecksetzenPruefen(umfang); if (knopf) knopf.textContent = ZURUECK[umfang].knopf; return; }
  dialogZu();
  melden(r.sicherung ? `Zurückgesetzt. Der alte Stand liegt als ${r.sicherung} im Ordner sicherungen.`
                     : "Zurückgesetzt.");
  Z.einst = await hole("/api/einstellungen");
  Z.start = await hole("/api/start");
  einstReiter = "firma";
  zeige("start");
}

/* ==========================================================================
   Sperre: das Passwort beim Oeffnen
   ========================================================================== */

let sperrstand = { aktiv: false, offen: true };

async function sperrstandHolen() {
  try {
    sperrstand = await fetch("/api/sperre").then(a => a.json());
  } catch (f) {
    sperrstand = { aktiv: false, offen: true };
  }
  return sperrstand;
}

function sperrleisteZeichnen() {
  const knopf = document.getElementById("sperrleiste");
  if (knopf) knopf.classList.toggle("versteckt", !sperrstand.aktiv);
}

/* Das Orbit-Zeichen aus der Seitenleiste, in gross. So bleibt es an einer
   Stelle gepflegt und taucht nicht zweimal im Quelltext auf. */
function orbitZeichen(groesse) {
  const svg = document.querySelector(".marke .zeichen svg");
  if (!svg) return "";
  const kopie = svg.cloneNode(true);
  kopie.setAttribute("width", groesse);
  kopie.setAttribute("height", groesse);
  // Die Verlaeufe brauchen eigene Namen: das Original liegt im ausgeblendeten
  // Grundgeruest, und darauf zeigende Farbverweise blieben sonst leer.
  return kopie.outerHTML.replace(/(["#])o-/g, "$1sperr-");
}

function sperrbildschirm(grund) {
  const rahmen = document.querySelector(".rahmen");
  const zeichen = orbitZeichen(46);
  if (rahmen) rahmen.style.display = "none";
  dialogZu();
  document.getElementById("sperrplatz").innerHTML = `
    <div class="sperrgrund">
      <form class="sperrkarte" id="sperrkarte" onsubmit="sperreOeffnen(event); return false">
        <div class="zeichen" aria-hidden="true">${zeichen}</div>
        <h1>Willkommen zurück</h1>
        <p class="unterzeile">${e(grund || "Bitte gib dein Passwort ein.")}</p>
        <label class="feld"><span>Passwort</span>
          <div class="sperrfeld">
            <input type="password" id="sperrwort" autocomplete="current-password"
              aria-describedby="sperrfehler" enterkeyhint="go"
              onkeydown="if (event.key === 'Enter') { event.preventDefault(); sperreOeffnen(event); }">
            <button type="button" class="augen" id="sperrauge" aria-pressed="false"
              aria-label="Passwort anzeigen" onclick="sperreZeigen()">${icon("auge", 16)}</button>
          </div>
        </label>
        <div id="sperrfehler" role="alert" aria-live="assertive"></div>
        <button type="submit" class="knopf haupt" id="sperroeffnen">
          ${icon("schloss_auf", 14)} Öffnen</button>
      </form>
    </div>`;
  setTimeout(() => {
    const feld = document.getElementById("sperrwort");
    if (feld) feld.focus();
  }, 60);
}

function sperreZeigen() {
  const feld = document.getElementById("sperrwort");
  const knopf = document.getElementById("sperrauge");
  const zeigen = feld.type === "password";
  feld.type = zeigen ? "text" : "password";
  knopf.setAttribute("aria-pressed", zeigen ? "true" : "false");
  knopf.setAttribute("aria-label", zeigen ? "Passwort verbergen" : "Passwort anzeigen");
  knopf.innerHTML = icon(zeigen ? "auge_zu" : "auge", 16);
  feld.focus();
}

async function sperreOeffnen(ev) {
  if (ev) ev.preventDefault();
  const feld = document.getElementById("sperrwort");
  const knopf = document.getElementById("sperroeffnen");
  const platz = document.getElementById("sperrfehler");
  platz.innerHTML = "";
  knopf.disabled = true;
  knopf.innerHTML = "Einen Augenblick …";
  try {
    const antwort = await fetch("/api/sperre/oeffnen", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ passwort: feld.value })
    });
    const daten = await antwort.json();
    if (!antwort.ok) throw new Error(daten.fehler || "Das hat nicht geklappt.");

    document.getElementById("sperrplatz").innerHTML = "";
    const rahmen = document.querySelector(".rahmen");
    if (rahmen) rahmen.style.display = "";
    // Jetzt erst verraet der Server die Regeln - vorher war ja zu. Ohne das
    // wuesste die Ruheuhr nicht, nach wie vielen Minuten sie zumachen soll.
    await sperrstandHolen();
    letzteTat = Date.now();
    sperrleisteZeichnen();
    await losgehen();
  } catch (f) {
    knopf.disabled = false;
    knopf.innerHTML = `${icon("schloss_auf", 14)} Öffnen`;
    platz.innerHTML = `<div class="sperrmeldung">${icon("warnung", 14)}
      <span>${e(f.message)}</span></div>`;
    const karte = document.getElementById("sperrkarte");
    karte.classList.remove("nein");
    void karte.offsetWidth;          // damit das Schuetteln erneut anspringt
    karte.classList.add("nein");
    feld.value = "";
    feld.focus();
  }
}

/* Die Ruhezeit laeuft auch dann ab, wenn niemand etwas anklickt: sonst bliebe
   der Bildschirm mit allen Zahlen stehen, waehrend der Platz leer ist. */
let letzteTat = Date.now();

function sperruhrStarten() {
  ["mousedown", "keydown", "wheel", "touchstart"].forEach(art =>
    document.addEventListener(art, () => { letzteTat = Date.now(); }, { passive: true }));
  setInterval(() => {
    const minuten = Number(sperrstand.minuten || 0);
    if (!sperrstand.aktiv || !sperrstand.offen || !minuten) return;
    if (Date.now() - letzteTat > minuten * 60000) sperreZu();
  }, 15000);
}

async function sperreZu() {
  await fetch("/api/sperre/zu", { method: "POST", headers: { "Content-Type": "application/json" },
    body: "{}" });
  location.reload();
}

/* ---- In den Einstellungen ---- */

async function sperreEinschalten() {
  const neu = document.getElementById("sp_neu").value;
  const wiederholung = document.getElementById("sp_neu2").value;
  const r = await versuche(() => sende("/api/sperre/setzen", { neu, wiederholung }),
    "Der Passwortschutz ist ab jetzt an.");
  if (r) { await sperrstandHolen(); sperrleisteZeichnen(); zeige("einstellungen"); }
}

function dialogPasswortAendern() {
  dialog("Passwort ändern", `
    <div class="stapel">
      <label class="feld"><span>Bisheriges Passwort</span>
        <input type="password" id="sp_d_alt" autocomplete="current-password"></label>
      <label class="feld"><span>Neues Passwort</span>
        <input type="password" id="sp_d_neu" autocomplete="new-password">
        <div class="hilfe">Mindestens 4 Zeichen.</div></label>
      <label class="feld"><span>Neues Passwort wiederholen</span>
        <input type="password" id="sp_d_neu2" autocomplete="new-password"></label>
    </div>`,
    `<button class="knopf still" onclick="dialogZu()">Abbrechen</button>
     <button class="knopf haupt" onclick="passwortAendern()">Passwort ändern</button>`);
}

async function passwortAendern() {
  const werte = {
    alt: document.getElementById("sp_d_alt").value,
    neu: document.getElementById("sp_d_neu").value,
    wiederholung: document.getElementById("sp_d_neu2").value
  };
  const r = await versuche(() => sende("/api/sperre/setzen", werte), "Das Passwort ist geändert.");
  if (r) { dialogZu(); zeige("einstellungen"); }
}

function dialogPasswortAus() {
  dialog("Passwortschutz ausschalten", `
    <p style="margin:0 0 14px">Danach öffnet sich MeinOrbit wieder ohne Nachfrage.
      Zur Sicherheit einmal das Passwort eingeben.</p>
    <label class="feld"><span>Passwort</span>
      <input type="password" id="sp_d_weg" autocomplete="current-password"></label>`,
    `<button class="knopf still" onclick="dialogZu()">Abbrechen</button>
     <button class="knopf gefahr" onclick="passwortAus()">Schutz ausschalten</button>`);
}

async function passwortAus() {
  const passwort = document.getElementById("sp_d_weg").value;
  const r = await versuche(() => sende("/api/sperre/aus", { passwort }),
    "Der Passwortschutz ist aus.");
  if (r) { dialogZu(); await sperrstandHolen(); sperrleisteZeichnen(); zeige("einstellungen"); }
}

async function sperreRegeln() {
  const werte = {
    beim_oeffnen: document.getElementById("sp_oeffnen").value,
    minuten: Number(document.getElementById("sp_minuten").value)
  };
  await versuche(() => sende("/api/sperre/regeln", werte), "Gemerkt.");
}

/* ==========================================================================
   Start des Programms
   ========================================================================== */

const ANSICHTEN = {
  start: ansichtStart,
  kunden: ansichtKunden,
  auftraege: ansichtAuftraege,
  rechnungen: ansichtRechnungen,
  finanzen: ansichtFinanzen,
  kalender: ansichtKalender,
  content: CONTENTPLANUNG_AN ? ansichtContent : ansichtStart,
  aufgaben: ansichtAufgaben,
  einstellungen: ansichtEinstellungen
};

window.addEventListener("hashchange", () => {
  const ziel = location.hash.replace("#", "");
  if (ziel && ziel !== Z.ansicht) {
    const [ansicht, id] = ziel.split(":");
    if (ANSICHTEN[ansicht]) zeige(ansicht, id);
  }
});

document.addEventListener("keydown", (ev) => {
  if (ev.key === "/" && !/input|textarea|select/i.test(document.activeElement.tagName)) {
    const suche = document.querySelector(".suchfeld input");
    if (suche) { ev.preventDefault(); suche.focus(); }
  }
});

async function losgehen() {
  try {
    Z.einst = await hole("/api/einstellungen");
    Z.start = await hole("/api/start");
  } catch (f) {
    malen(`<div class="karte"><div class="leer">${icon("leer", 30)}
      <p>Die Verbindung zum Programm steht nicht. Bitte die Seite neu laden.</p></div></div>`);
    return;
  }
  const firma = (Z.einst.einstellungen || {}).firma_name
    || (Z.einst.einstellungen || {}).firma_inhaber || "";
  if (firma) {
    document.getElementById("markenname").textContent = firma;
    document.getElementById("markenzusatz").textContent = "MeinOrbit";
  }
  const ziel = location.hash.replace("#", "");
  const [ansicht, id] = (ziel && ANSICHTEN[ziel.split(":")[0]] ? ziel : "start").split(":");
  zeige(ansicht, id);
}

(async function los() {
  await sperrstandHolen();
  sperrleisteZeichnen();
  sperruhrStarten();
  if (sperrstand.aktiv && !sperrstand.offen) { sperrbildschirm(); return; }
  losgehen();
})();
</script>
